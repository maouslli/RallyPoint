<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RallyPoint — standalone 2-court demonstrator</title>
<style>
/* RallyPoint — styles
   Two surfaces, one family.
   Court tablet: true black, white numerals, optic yellow = serving/live, red = needs a person.
   Organizer desk: cool paper, courts drawn as courts. */

:root {
  --font: "Bahnschrift", "DIN Alternate", "Roboto Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --mono: "Bahnschrift", "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  --ball: #D6F53C;
  --alert: #FF3B30;
  --ok: #6BE58A;
  /* desk palette */
  --paper: #E9EDEB;
  --panel: #F7F9F8;
  --ink: #10242F;
  --muted: #5A6B74;
  --rule: #C9D2CF;
  --court: #1E5A8A;
  --court-dark: #163F61;
  --surround: #2F7A55;
  --line: #FFFFFF;
  --alert-desk: #D42B2B;
  --radius: 6px;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body { font-family: var(--font); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible { outline: 3px solid var(--ball); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }

/* =====================================================================
   Landing — RallyPoint homepage (night session)
   A WebGL court sits fixed behind the page; the sections scroll over it.
   ===================================================================== */
body.lp { --bg: #05070A; --fg: #F2F5F3; --dim: #93A1A8; --panel-lp: rgba(10, 16, 22, 0.72); --edge: rgba(255, 255, 255, 0.12); background: var(--bg); color: var(--fg); min-height: 100%; overflow-x: hidden; }
body.lp a { color: inherit; }
.lp-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }
.lp-vignette { position: fixed; inset: 0; z-index: 1; pointer-events: none; background: radial-gradient(120% 90% at 50% 20%, transparent 40%, rgba(5, 7, 10, 0.55) 80%, rgba(5, 7, 10, 0.9) 100%); }
body.lp.no-webgl .lp-canvas { display: none; }
.lp-fallback { display: none; position: fixed; inset: 0; z-index: 0; overflow: hidden; perspective: 900px; }
body.lp.no-webgl .lp-fallback { display: block; }
.lp-fallback .plane { position: absolute; left: 50%; top: 58%; width: 62vmin; height: 134vmin; transform: translate(-50%, -50%) rotateX(62deg); background: #0E3247; border: 3px solid #fff; box-shadow: 0 0 60px rgba(214, 245, 60, 0.15); }
.lp-fallback .plane::before { content: ""; position: absolute; left: 12.5%; right: 12.5%; top: 0; bottom: 0; border-left: 3px solid #fff; border-right: 3px solid #fff; }
.lp-fallback .plane::after { content: ""; position: absolute; left: 12.5%; right: 12.5%; top: 23%; bottom: 23%; border-top: 3px solid #fff; border-bottom: 3px solid #fff; background: linear-gradient(#fff, #fff) center / 3px 100% no-repeat; }
.lp-fallback .net { position: absolute; left: 50%; top: 50%; width: 64vmin; height: 5px; background: #fff; transform: translate(-50%, -50%); box-shadow: 0 -40px 0 -1px rgba(255, 255, 255, 0.25); }

/* nav */
.lp-nav { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 22px; padding: 14px clamp(16px, 4vw, 48px); background: linear-gradient(rgba(5, 7, 10, 0.85), rgba(5, 7, 10, 0)); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.lp-brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 700; font-size: 20px; letter-spacing: 0.01em; }
.lp-mark { width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #EEFF8A, var(--ball) 55%, #9BB61E); position: relative; box-shadow: 0 0 18px rgba(214, 245, 60, 0.55); }
.lp-mark::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.85); border-left-color: transparent; border-right-color: transparent; transform: rotate(-35deg); }
.lp-nav nav { display: flex; gap: 18px; margin-left: 8px; }
.lp-nav nav a { text-decoration: none; color: var(--dim); font-size: 15px; padding: 6px 2px; border-bottom: 2px solid transparent; }
.lp-nav nav a:hover { color: var(--fg); border-bottom-color: var(--ball); }
.lp-live { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--dim); white-space: nowrap; font-variant-numeric: tabular-nums; }
.lp-live i { width: 8px; height: 8px; border-radius: 50%; background: var(--ball); box-shadow: 0 0 10px var(--ball); animation: pulse 1.6s infinite; }
.lp-live b { color: var(--fg); }

/* hero */
main.lp-main { position: relative; z-index: 2; }
.lp-hero { min-height: 100svh; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 32px; padding: 12vh clamp(16px, 4vw, 48px) 8vh; }
.lp-kicker { margin: 0 0 14px; color: var(--ball); font-size: 15px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 700; }
.lp-hero h1 { margin: 0 0 18px; font-size: clamp(44px, 8.4vw, 118px); line-height: 0.92; letter-spacing: -0.03em; font-stretch: 87.5%; text-shadow: 0 6px 40px rgba(0, 0, 0, 0.6); }
.lp-hero h1 em { font-style: normal; color: var(--ball); }
.lp-lede { margin: 0 0 28px; max-width: 52ch; font-size: clamp(17px, 1.6vw, 21px); line-height: 1.45; color: var(--dim); }
.lp-lede b { color: var(--fg); font-weight: 600; }
.lp-cta { display: flex; flex-wrap: wrap; gap: 12px; }
.lp-btn { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; padding: 14px 22px; border-radius: 999px; border: 2px solid var(--edge); font-weight: 700; font-size: 16px; transition: transform 0.15s, border-color 0.15s, background 0.15s; }
.lp-btn:hover { transform: translateY(-2px); border-color: var(--fg); }
.lp-btn.primary { background: var(--ball); color: #000; border-color: var(--ball); box-shadow: 0 10px 40px rgba(214, 245, 60, 0.25); }
.lp-btn.primary:hover { background: #E4FF5A; }
.lp-btn svg { width: 18px; height: 18px; }

/* broadcast bug */
.lp-board { width: min(360px, 100%); background: var(--panel-lp); border: 1px solid var(--edge); border-radius: 12px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding: 14px 16px 12px; font-variant-numeric: tabular-nums; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5); transition: box-shadow 0.4s, border-color 0.4s; }
.lp-board.flash { border-color: var(--ball); box-shadow: 0 0 0 1px var(--ball), 0 20px 60px rgba(214, 245, 60, 0.25); }
.lp-board .head { display: grid; grid-template-columns: minmax(0, 1fr) 40px 40px 52px; gap: 6px; color: var(--dim); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; padding-bottom: 6px; }
.lp-board .head span:not(:first-child) { text-align: center; }
.lp-board .row { display: grid; grid-template-columns: minmax(0, 1fr) 40px 40px 52px; gap: 6px; align-items: center; padding: 6px 0; border-top: 1px solid var(--edge); font-size: 17px; font-weight: 700; }
.lp-board .row .nm { display: flex; align-items: center; gap: 8px; min-width: 0; }
.lp-board .row .nm span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lp-board .row .nm i { flex: none; width: 9px; height: 9px; border-radius: 50%; background: transparent; }
.lp-board .row.serving .nm i { background: var(--ball); box-shadow: 0 0 8px var(--ball); }
.lp-board .row .n { text-align: center; }
.lp-board .row .n.pts { font-size: 22px; color: var(--ball); }
.lp-board .row.winner .nm { color: var(--ball); }
.lp-board .call { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--edge); display: flex; justify-content: space-between; gap: 10px; font-size: 14px; color: var(--dim); }
.lp-board .call b { color: var(--fg); font-size: 16px; }
.lp-board .call .set { white-space: nowrap; }

/* sections over the scene */
.lp-section { padding: 72px clamp(16px, 4vw, 48px); background: linear-gradient(rgba(5, 7, 10, 0), rgba(5, 7, 10, 0.94) 120px, rgba(5, 7, 10, 0.94)); }
.lp-section + .lp-section { background: rgba(5, 7, 10, 0.94); padding-top: 0; }
.lp-section h2 { font-size: clamp(28px, 4vw, 44px); margin: 0 0 6px; letter-spacing: -0.02em; line-height: 1; }
.lp-section .sub { margin: 0 0 28px; color: var(--dim); font-size: 17px; max-width: 60ch; }

/* doors: court-side signage */
.lp-doors { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; max-width: 1240px; perspective: 1200px; }
.lp-door { --tx: 0deg; --ty: 0deg; position: relative; display: flex; flex-direction: column; gap: 10px; min-height: 200px; padding: 22px 20px 24px; border-radius: 14px; text-decoration: none; background: linear-gradient(160deg, rgba(20, 30, 40, 0.9), rgba(8, 12, 16, 0.9)); border: 1px solid var(--edge); overflow: hidden; transform: rotateX(var(--tx)) rotateY(var(--ty)); transform-style: preserve-3d; transition: transform 0.12s ease-out, border-color 0.2s, box-shadow 0.2s; }
.lp-door::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--ball); transform: scaleX(0); transform-origin: left; transition: transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1); }
.lp-door::after { content: ""; position: absolute; inset: 0; background: radial-gradient(240px 160px at var(--mx, 50%) var(--my, 50%), rgba(214, 245, 60, 0.14), transparent 70%); opacity: 0; transition: opacity 0.25s; pointer-events: none; }
.lp-door:hover, .lp-door:focus-visible { border-color: rgba(214, 245, 60, 0.55); box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5); }
.lp-door:hover::before, .lp-door:focus-visible::before { transform: scaleX(1); }
.lp-door:hover::after { opacity: 1; }
.lp-door .ic { width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; background: rgba(255, 255, 255, 0.06); border: 1px solid var(--edge); color: var(--ball); }
.lp-door .ic svg { width: 24px; height: 24px; }
.lp-door strong { font-size: 26px; line-height: 1; margin-top: auto; }
.lp-door span { color: var(--dim); font-size: 15px; line-height: 1.4; }
.lp-door .go { position: absolute; right: 18px; bottom: 20px; color: var(--ball); font-weight: 700; font-size: 20px; opacity: 0; transform: translateX(-6px); transition: opacity 0.2s, transform 0.2s; }
.lp-door:hover .go { opacity: 1; transform: none; }
.lp-door.desk .ic { color: #6BE58A; }
.lp-door.demo .ic { color: #fff; }

/* how it works */
.lp-steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; max-width: 1240px; counter-reset: step; }
.lp-step { position: relative; padding: 24px 20px 22px; border: 1px solid var(--edge); border-radius: 14px; background: rgba(255, 255, 255, 0.03); }
.lp-step::before { counter-increment: step; content: "0" counter(step); display: block; color: var(--ball); font-weight: 700; font-size: 13px; letter-spacing: 0.14em; margin-bottom: 12px; }
.lp-step h3 { margin: 0 0 8px; font-size: 22px; line-height: 1.1; }
.lp-step p { margin: 0; color: var(--dim); line-height: 1.45; font-size: 15px; }
.lp-step p b { color: var(--fg); font-weight: 600; }
.lp-calls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.lp-calls span { border: 1px solid var(--edge); border-radius: 999px; padding: 4px 10px; font-size: 13px; color: var(--fg); }

/* footer */
.lp-foot { padding: 28px clamp(16px, 4vw, 48px) 40px; border-top: 1px solid var(--edge); background: rgba(5, 7, 10, 0.94); display: flex; flex-wrap: wrap; gap: 12px 28px; align-items: center; color: var(--dim); font-size: 14px; }
.lp-foot code { background: rgba(255, 255, 255, 0.08); padding: 2px 7px; border-radius: 4px; font-family: var(--mono); font-size: 0.95em; color: var(--fg); }
.lp-foot .spacer { flex: 1; }

@media (max-width: 900px) {
  .lp-hero { grid-template-columns: 1fr; align-items: start; padding-top: 9vh; padding-bottom: 6vh; }
  .lp-lede { font-size: 16px; }
  .lp-board { width: 100%; max-width: 420px; margin-top: 34vh; }
  .lp-nav nav { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .lp-live i { animation: none; }
  .lp-door { transition: none; transform: none !important; }
}

/* =====================================================================
   Court tablet
   ===================================================================== */
.court-root { --u: max(min(1cqw, 1.8cqh), min(1.75cqw, 1.3cqh)); container-type: size; container-name: court; width: 100%; height: 100%; background: #000; color: #fff; display: flex; flex-direction: column; position: relative; overflow: hidden; user-select: none; -webkit-user-select: none; }
.court-root.glare { --dimtext: #FFFFFF; }
.court-root { --dimtext: #AEB7BC; }

.ct-top { display: flex; align-items: center; gap: calc(1.6 * var(--u)); padding: calc(1.2 * var(--u)) calc(2 * var(--u)); border-bottom: 2px solid #2A2F33; font-size: calc(2.1 * var(--u)); line-height: 1; white-space: nowrap; }
.ct-top .id { font-weight: 700; font-size: calc(2.6 * var(--u)); }
.ct-top .tour { color: var(--dimtext); overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
.pill { display: inline-flex; align-items: center; gap: 0.5em; padding: 0.35em 0.7em; border: 2px solid #3A4045; border-radius: 999px; font-size: 0.85em; white-space: nowrap; }
.pill::before { content: ""; width: 0.65em; height: 0.65em; border-radius: 50%; background: #3A4045; }
.pill.live { border-color: var(--ball); color: var(--ball); } .pill.live::before { background: var(--ball); animation: pulse 1.6s infinite; }
.pill.voice-on { border-color: var(--ok); color: var(--ok); } .pill.voice-on::before { background: var(--ok); animation: pulse 1.6s infinite; }
.pill.voice-off::before { background: #3A4045; }
.pill.voice-blocked { border-color: var(--alert); color: var(--alert); } .pill.voice-blocked::before { background: var(--alert); }
.pill.net-online { color: var(--dimtext); } .pill.net-online::before { background: var(--ok); }
.pill.net-offline { border-color: var(--alert); color: var(--alert); } .pill.net-offline::before { background: var(--alert); }
.pill.net-connecting::before { background: #FFB020; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

/* score wall */
.ct-board { flex: 1 1 auto; display: grid; grid-template-columns: 1fr auto; gap: 0 calc(2 * var(--u)); padding: calc(1.2 * var(--u)) calc(2 * var(--u)) calc(0.5 * var(--u)); min-height: 0; }
.ct-board .wall { display: grid; grid-template-columns: minmax(0, 1fr) calc(8 * var(--u)) calc(8 * var(--u)) calc(10 * var(--u)); grid-auto-rows: auto; align-items: center; column-gap: calc(1.2 * var(--u)); }
.wall .head { color: var(--dimtext); font-size: calc(1.8 * var(--u)); text-align: center; padding-bottom: calc(0.4 * var(--u)); letter-spacing: 0.04em; }
.wall .head.first { text-align: left; }
.wall .team { display: flex; flex-direction: column; gap: calc(0.2 * var(--u)); min-width: 0; padding: calc(0.6 * var(--u)) 0; }
.wall .team .names { font-size: calc(4.2 * var(--u)); font-weight: 700; line-height: 1.05; white-space: nowrap; display: flex; align-items: center; gap: calc(1.2 * var(--u)); min-width: 0; }
.wall .team .names > span:not(.dot) { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.wall .team .names .dot { flex: none; width: calc(2.6 * var(--u)); height: calc(2.6 * var(--u)); border-radius: 50%; background: transparent; }
.wall .team.serving .names .dot { background: var(--ball); box-shadow: 0 0 0 calc(0.5 * var(--u)) rgba(214, 245, 60, 0.18); }
.wall .team .role { font-size: calc(2.1 * var(--u)); color: var(--dimtext); padding-left: calc(3.8 * var(--u)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wall .team.serving .role { color: var(--ball); }
.wall .team .role.gp { color: #fff; }
.wall .num { font-size: calc(7 * var(--u)); font-weight: 700; text-align: center; line-height: 1; font-variant-numeric: tabular-nums; }
.wall .num.pts { font-size: calc(8.2 * var(--u)); }
.wall .team-row { display: contents; }
.wall .sep { grid-column: 1 / -1; height: 2px; background: #2A2F33; }
.wall .prev-sets { grid-column: 1 / -1; color: var(--dimtext); font-size: calc(2 * var(--u)); padding-top: calc(0.6 * var(--u)); }
.wall .prev-sets b { color: #fff; font-weight: 700; }

.ct-side { display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between; text-align: right; min-width: calc(16 * var(--u)); padding-top: calc(0.6 * var(--u)); }
.serve-clock .lbl { color: var(--dimtext); font-size: calc(1.9 * var(--u)); }
.serve-clock .val { font-size: calc(8 * var(--u)); font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.serve-clock.late .val { color: var(--alert); }
.serve-clock.warn .val { color: var(--ball); }
.ct-side .mode { color: var(--dimtext); font-size: calc(2 * var(--u)); line-height: 1.35; }
.ct-side .mode b { color: #fff; }
.ct-side .call { font-size: calc(3.4 * var(--u)); font-weight: 700; color: var(--ball); line-height: 1.1; margin-top: calc(0.4 * var(--u)); }
.ct-side .call small { display: block; color: var(--dimtext); font-size: calc(1.8 * var(--u)); font-weight: 400; }

/* tactile controls */
.ct-controls { padding: calc(0.8 * var(--u)) calc(2 * var(--u)) calc(1 * var(--u)); display: grid; gap: calc(0.9 * var(--u)); }
.ct-controls .points { display: grid; grid-template-columns: 1fr 1fr; gap: calc(1 * var(--u)); }
.bigbtn { background: #101418; color: #fff; border: 3px solid #3A4045; border-radius: 10px; padding: calc(1.6 * var(--u)) calc(1 * var(--u)); font-size: calc(3 * var(--u)); font-weight: 700; line-height: 1.1; min-height: calc(8 * var(--u)); text-align: left; display: flex; flex-direction: column; gap: calc(0.3 * var(--u)); }
.bigbtn small { font-size: calc(1.9 * var(--u)); font-weight: 400; color: var(--dimtext); }
.bigbtn:active { background: #1D2A1A; border-color: var(--ball); transform: scale(0.99); }
.ct-controls .row { display: grid; grid-template-columns: repeat(6, 1fr); gap: calc(0.8 * var(--u)); }
.ctl { background: #000; color: #fff; border: 3px solid #3A4045; border-radius: 10px; padding: calc(1.2 * var(--u)) calc(0.6 * var(--u)); font-size: calc(2.2 * var(--u)); font-weight: 700; min-height: calc(6 * var(--u)); line-height: 1.1; }
.ctl.warn { border-color: #FFB020; color: #FFB020; }
.ctl.danger { border-color: var(--alert); color: var(--alert); }
.ctl.on { background: var(--ball); color: #000; border-color: var(--ball); }
.ctl:active { background: #1A1F23; }
.ctl:disabled { opacity: 0.35; cursor: default; }

/* voice strip */
.ct-voice { border-top: 2px solid #2A2F33; padding: calc(0.9 * var(--u)) calc(2 * var(--u)) calc(1 * var(--u)); display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: calc(1.4 * var(--u)); align-items: center; font-size: calc(2 * var(--u)); min-height: calc(6.5 * var(--u)); }
.ct-voice .mic { display: flex; align-items: center; gap: calc(0.8 * var(--u)); }
.ct-voice .mic button { background: #000; border: 3px solid #3A4045; color: #fff; border-radius: 999px; width: calc(5 * var(--u)); height: calc(5 * var(--u)); font-size: calc(2.6 * var(--u)); display: grid; place-items: center; }
.ct-voice .mic button.on { border-color: var(--ok); color: var(--ok); }
.ct-voice .mic button.armed { background: var(--ok); color: #000; }
.ct-voice .mic button.blocked { border-color: var(--alert); color: var(--alert); }
.ct-voice .heard { min-width: 0; line-height: 1.3; }
.ct-voice .heard .t { color: var(--dimtext); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ct-voice .heard .t q { color: #fff; }
.ct-voice .heard .r { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ct-voice .heard .r.ok { color: var(--ok); }
.ct-voice .heard .r.bad { color: #FFB020; }
.ct-voice .typed { display: flex; gap: calc(0.5 * var(--u)); }
.ct-voice .typed input { background: #000; border: 2px solid #3A4045; color: #fff; border-radius: 6px; padding: calc(0.5 * var(--u)) calc(0.8 * var(--u)); width: calc(18 * var(--u)); font-size: calc(2 * var(--u)); }
.ct-voice .typed input::placeholder { color: #6A737A; }
.ct-voice .typed button { border: 2px solid #3A4045; background: #000; color: #fff; border-radius: 6px; padding: 0 calc(1 * var(--u)); font-size: calc(1.9 * var(--u)); }

/* overlays */
.ct-overlay { position: absolute; inset: 0; background: #000; display: flex; flex-direction: column; z-index: 20; }
.ct-overlay.dim { background: rgba(0, 0, 0, 0.92); }
.ct-overlay .bar { display: flex; align-items: baseline; justify-content: space-between; padding: calc(1.5 * var(--u)) calc(2.5 * var(--u)); border-bottom: 2px solid #2A2F33; }
.ct-overlay .bar .k { font-size: calc(3.2 * var(--u)); font-weight: 700; }
.ct-overlay .bar .k small { color: var(--dimtext); font-weight: 400; font-size: calc(2 * var(--u)); margin-left: calc(1 * var(--u)); }
.ct-overlay .bar .clock { font-size: calc(9 * var(--u)); font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.ct-overlay .bar .clock.time { color: var(--ball); }
.ct-overlay .ad { flex: 1; display: grid; grid-template-rows: auto 1fr auto; padding: calc(2.5 * var(--u)); min-height: 0; transition: background 0.4s; }
.ct-overlay .ad .who { font-size: calc(1.9 * var(--u)); opacity: 0.8; }
.ct-overlay .ad .body { display: flex; flex-direction: column; justify-content: center; gap: calc(1 * var(--u)); min-height: 0; }
.ct-overlay .ad .body img { max-height: calc(24 * var(--u)); max-width: 60%; object-fit: contain; align-self: flex-start; }
.ct-overlay .ad .name { font-size: calc(8 * var(--u)); font-weight: 700; line-height: 0.95; letter-spacing: -0.01em; }
.ct-overlay .ad .tag { font-size: calc(3 * var(--u)); line-height: 1.25; max-width: 40ch; }
.ct-overlay .ad .foot { display: flex; justify-content: space-between; align-items: center; gap: calc(1 * var(--u)); }
.ct-overlay .ad .foot .dots { display: flex; gap: calc(0.6 * var(--u)); }
.ct-overlay .ad .foot .dots i { width: calc(1.2 * var(--u)); height: calc(1.2 * var(--u)); border-radius: 50%; background: currentColor; opacity: 0.35; }
.ct-overlay .ad .foot .dots i.on { opacity: 1; }
.ct-overlay .ad .foot .score { font-size: calc(2.2 * var(--u)); opacity: 0.85; }
.ct-overlay .actions { display: flex; gap: calc(1 * var(--u)); padding: calc(1.5 * var(--u)) calc(2.5 * var(--u)); border-top: 2px solid #2A2F33; }
.ct-overlay .timecall { position: absolute; inset: 0; display: grid; place-items: center; background: var(--ball); color: #000; font-size: calc(22 * var(--u)); font-weight: 700; z-index: 30; animation: flash 0.5s 3; }
@keyframes flash { 50% { opacity: 0.2; } }

.ct-center { flex: 1; display: grid; place-items: center; padding: calc(1.5 * var(--u)) calc(3 * var(--u)); text-align: center; min-height: 0; overflow: auto; }
.ct-center .msg { max-width: min(100%, calc(84 * var(--u))); }
.ct-center h2 { font-size: calc(4.4 * var(--u)); margin: 0 0 calc(0.8 * var(--u)); line-height: 1.05; }
.ct-center p { font-size: calc(2.4 * var(--u)); color: var(--dimtext); margin: 0 0 calc(1 * var(--u)); line-height: 1.35; }
.ct-center .vs { font-size: calc(3.6 * var(--u)); font-weight: 700; line-height: 1.15; margin: calc(0.6 * var(--u)) 0 calc(1.2 * var(--u)); }
.ct-center .vs .v { color: var(--dimtext); font-weight: 400; font-size: calc(2.6 * var(--u)); margin: calc(0.6 * var(--u)) 0; }
.ct-center .rules { font-size: calc(2 * var(--u)); color: var(--dimtext); margin-bottom: calc(1.2 * var(--u)); }
.ct-center .choose { display: grid; grid-template-columns: 1fr 1fr; gap: calc(1 * var(--u)); margin: 0 auto calc(1 * var(--u)); max-width: calc(70 * var(--u)); }
.ct-center .choose .grp { border: 2px solid #2A2F33; border-radius: 10px; padding: calc(1 * var(--u)); text-align: left; }
.ct-center .choose .grp .lbl { color: var(--dimtext); font-size: calc(1.8 * var(--u)); margin-bottom: calc(0.6 * var(--u)); }
.ct-center .choose .grp .opts { display: flex; flex-wrap: wrap; gap: calc(0.6 * var(--u)); }
.ct-center .final { font-size: calc(6 * var(--u)); font-weight: 700; line-height: 1; margin: calc(1 * var(--u)) 0; }

/* modal */
.ct-modal { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.88); z-index: 40; display: grid; place-items: center; padding: calc(3 * var(--u)); }
.ct-modal .box { background: #000; border: 3px solid #3A4045; border-radius: 12px; padding: calc(2 * var(--u)); width: min(calc(80 * var(--u)), 100%); max-height: 100%; overflow: auto; }
.ct-modal h3 { margin: 0 0 calc(1 * var(--u)); font-size: calc(3.4 * var(--u)); }
.ct-modal p { color: var(--dimtext); font-size: calc(2.2 * var(--u)); margin: 0 0 calc(1.5 * var(--u)); line-height: 1.35; }
.ct-modal .grid { display: grid; grid-template-columns: 1fr 1fr; gap: calc(1 * var(--u)); margin-bottom: calc(1.5 * var(--u)); }
.ct-modal .stepper { border: 2px solid #2A2F33; border-radius: 10px; padding: calc(1 * var(--u)); }
.ct-modal .stepper .lbl { color: var(--dimtext); font-size: calc(1.9 * var(--u)); }
.ct-modal .stepper .ctr { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: calc(1 * var(--u)); }
.ct-modal .stepper .ctr .v { text-align: center; font-size: calc(5 * var(--u)); font-weight: 700; font-variant-numeric: tabular-nums; }
.ct-modal .stepper .ctr button { width: calc(6 * var(--u)); height: calc(6 * var(--u)); font-size: calc(3.2 * var(--u)); border-radius: 10px; }
.ct-modal .btns { display: flex; gap: calc(1 * var(--u)); justify-content: flex-end; flex-wrap: wrap; }

/* toast */
.ct-toast { position: absolute; left: 50%; top: calc(7.2 * var(--u)); transform: translateX(-50%); background: #fff; color: #000; border-radius: 12px; padding: calc(1.2 * var(--u)) calc(1.6 * var(--u)); font-size: calc(2.4 * var(--u)); display: flex; align-items: center; gap: calc(1.6 * var(--u)); z-index: 35; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6); max-width: calc(90 * var(--u)); }
.ct-toast.bad { background: #FFB020; }
.ct-toast.alert { background: var(--alert); color: #fff; }
.ct-toast button { border: 2px solid currentColor; background: transparent; border-radius: 8px; padding: calc(0.5 * var(--u)) calc(1.2 * var(--u)); font-weight: 700; font-size: calc(2.2 * var(--u)); white-space: nowrap; }
.ct-toast .bar { position: absolute; left: 0; bottom: 0; height: 4px; background: #000; opacity: 0.35; border-radius: 0 0 12px 12px; transition: width linear; }

/* settings drawer */
.ct-settings { position: absolute; top: 0; right: 0; bottom: 0; width: min(calc(46 * var(--u)), 100%); background: #0A0C0E; border-left: 2px solid #2A2F33; z-index: 45; padding: calc(2 * var(--u)); overflow: auto; font-size: calc(2.1 * var(--u)); }
.ct-settings h3 { margin: 0 0 calc(1 * var(--u)); font-size: calc(3 * var(--u)); }
.ct-settings label { display: flex; justify-content: space-between; align-items: center; gap: calc(1 * var(--u)); padding: calc(0.8 * var(--u)) 0; border-bottom: 1px solid #2A2F33; }
.ct-settings input[type=text], .ct-settings select { background: #000; border: 2px solid #3A4045; color: #fff; border-radius: 6px; padding: calc(0.4 * var(--u)) calc(0.6 * var(--u)); max-width: 55%; }
.ct-settings input[type=checkbox] { width: calc(2.4 * var(--u)); height: calc(2.4 * var(--u)); accent-color: var(--ball); }
.ct-settings .log { margin-top: calc(1.5 * var(--u)); color: var(--dimtext); font-size: calc(1.8 * var(--u)); line-height: 1.4; }
.ct-settings .log div { border-bottom: 1px solid #1A1F23; padding: calc(0.4 * var(--u)) 0; }
.ct-settings .close { margin-top: calc(1.5 * var(--u)); }

/* Phones and portrait screens: the board stacks, the small controls wrap, the voice strip folds.
   --u already grows in portrait (see .court-root), so type stays readable. */
@media (orientation: portrait) { .court-root { overflow-y: auto; } }
@container court (orientation: portrait) {
  .ct-top { flex-wrap: wrap; row-gap: calc(0.8 * var(--u)); }
  .ct-top .tour { flex-basis: 100%; order: 9; }
  .ct-board { grid-template-columns: 1fr; row-gap: calc(1 * var(--u)); align-content: start; }
  .ct-board .wall { grid-template-columns: minmax(0, 1fr) calc(6 * var(--u)) calc(6 * var(--u)) calc(8 * var(--u)); }
  .wall .team .names { font-size: calc(3.7 * var(--u)); }
  .wall .num { font-size: calc(6 * var(--u)); } .wall .num.pts { font-size: calc(7 * var(--u)); }
  .ct-side { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; column-gap: calc(2 * var(--u)); text-align: left; min-width: 0; padding-top: calc(1 * var(--u)); border-top: 2px solid #2A2F33; }
  .ct-side .serve-clock { grid-column: 2; grid-row: 1; text-align: right; }
  .ct-side .call { grid-column: 1; grid-row: 1; margin-top: 0; }
  .ct-side .mode { grid-column: 1 / -1; grid-row: 2; }
  .ct-controls .row { grid-template-columns: repeat(3, 1fr); }
  .ct-voice { grid-template-columns: auto minmax(0, 1fr); }
  .ct-voice .typed { grid-column: 1 / -1; }
  .ct-voice .typed input { flex: 1; width: auto; min-width: 0; }
  .ct-overlay .bar { flex-wrap: wrap; gap: calc(1 * var(--u)); }
  .ct-overlay .ad .body img { max-width: 100%; }
  .ct-center .choose { grid-template-columns: 1fr; max-width: 100%; }
  .ct-modal .grid { grid-template-columns: 1fr; }
  .ct-modal .box { width: 100%; }
  .ct-settings { width: 100%; }
}

/* =====================================================================
   Organizer desk
   ===================================================================== */
.desk-root { container-type: inline-size; container-name: desk; background: var(--paper); color: var(--ink); min-height: 100%; height: 100%; overflow: auto; font-size: 15px; line-height: 1.35; }
.dk-top { display: flex; align-items: center; gap: 18px; padding: 14px 22px; background: var(--ink); color: #fff; position: sticky; top: 0; z-index: 5; }
.dk-top h1 { font-size: 22px; margin: 0; font-weight: 700; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.dk-top h1 input { background: transparent; border: 0; border-bottom: 2px solid transparent; color: #fff; font-size: 22px; font-weight: 700; width: 20ch; padding: 0; }
.dk-top h1 input:hover, .dk-top h1 input:focus { border-bottom-color: var(--ball); outline: 0; }
.dk-top h1 small { font-size: 14px; color: #AEB7BC; font-weight: 400; }
.dk-top .spacer { flex: 1; }
.dk-top .clock { font-variant-numeric: tabular-nums; color: #AEB7BC; white-space: nowrap; }
.dk-top .pill { font-size: 13px; }
.dk-top .pill.hub-ws { border-color: var(--ok); color: #fff; } .dk-top .pill.hub-ws::before { background: var(--ok); }
.dk-top .pill.hub-bc { border-color: var(--ball); color: #fff; } .dk-top .pill.hub-bc::before { background: var(--ball); }
.dk-top .pill.hub-local::before { background: var(--ball); }
.dk-top .pill.hub-off { border-color: var(--alert); color: #fff; } .dk-top .pill.hub-off::before { background: var(--alert); }

.dk-alerts { display: flex; flex-direction: column; gap: 6px; padding: 12px 22px 0; }
.dk-alert { display: flex; align-items: center; gap: 14px; background: #fff; border-left: 6px solid var(--court); padding: 10px 14px; border-radius: 0 var(--radius) var(--radius) 0; }
.dk-alert.umpire, .dk-alert.dispute { border-left-color: var(--alert-desk); background: #FDECEA; }
.dk-alert.freed { border-left-color: var(--surround); background: #EAF5EE; }
.dk-alert.result { border-left-color: var(--ink); }
.dk-alert .when { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; min-width: 5.5ch; }
.dk-alert .txt { flex: 1; }
.dk-alert .acts { display: flex; gap: 6px; }

.dk-main { display: grid; grid-template-columns: 300px minmax(0, 1fr) 340px; gap: 18px; padding: 16px 22px 40px; align-items: start; }
.dk-main > * { min-width: 0; }
@container desk (max-width: 1180px) { .dk-main { grid-template-columns: 1fr 1fr; } .dk-main .courts-col { grid-column: 1 / -1; order: -1; } }
@container desk (max-width: 720px) { .dk-main { grid-template-columns: 1fr; } .dk-main .courts-col { order: -1; } }
@container desk (max-width: 560px) { .dk-top h1 small { display: none; } .dk-top .pill:not(.hub-ws):not(.hub-bc):not(.hub-local):not(.hub-off) { display: none; } }

.dk-panel { background: var(--panel); border: 1px solid var(--rule); border-radius: var(--radius); }
.dk-panel > h2 { font-size: 17px; margin: 0; padding: 12px 14px; border-bottom: 1px solid var(--rule); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.dk-panel > h2 small { color: var(--muted); font-weight: 400; font-size: 13px; }
.dk-panel .body { padding: 12px 14px; }
.dk-panel + .dk-panel { margin-top: 18px; }
.dk-panel .empty { color: var(--muted); padding: 6px 0; }

/* buttons */
.btn { background: #fff; border: 2px solid var(--ink); color: var(--ink); border-radius: var(--radius); padding: 7px 12px; font-weight: 700; font-size: 14px; line-height: 1.1; }
.btn:hover { background: #F0F3F2; }
.btn.primary { background: var(--ink); color: #fff; }
.btn.primary:hover { background: #1B3644; }
.btn.go { background: var(--surround); border-color: var(--surround); color: #fff; }
.btn.go:hover { filter: brightness(1.08); }
.btn.danger { border-color: var(--alert-desk); color: var(--alert-desk); }
.btn.sm { padding: 4px 8px; font-size: 13px; }
.btn.ghost { background: transparent; border-color: var(--rule); font-weight: 400; }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.yellow { background: var(--ball); border-color: var(--ball); color: var(--ink); }

/* court cards drawn as courts */
.courts { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 18px; }
.court-card { background: var(--panel); border: 1px solid var(--rule); border-radius: var(--radius); overflow: hidden; }
.court-card .cc-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--rule); }
.court-card .cc-head h3 { margin: 0; font-size: 18px; }
.court-card .cc-head .st { margin-left: auto; font-size: 13px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: #DDE4E1; color: var(--ink); display: inline-flex; align-items: center; gap: 6px; }
.court-card .cc-head .st::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.court-card .cc-head .st.live { background: var(--ink); color: var(--ball); } .court-card .cc-head .st.live::before { background: var(--ball); animation: pulse 1.6s infinite; }
.court-card .cc-head .st.rest { background: #FFF3CD; } .court-card .cc-head .st.rest::before { background: #FFB020; }
.court-card .cc-head .st.free { background: #EAF5EE; } .court-card .cc-head .st.free::before { background: var(--surround); }
.court-card .cc-head .st.assigned, .court-card .cc-head .st.ready { background: #E4ECF4; } .court-card .cc-head .st.assigned::before, .court-card .cc-head .st.ready::before { background: var(--court); }
.court-card .cc-head .st.done { background: #DDE4E1; }
.court-card .cc-head .st.offline { background: #FDECEA; color: var(--alert-desk); } .court-card .cc-head .st.offline::before { background: var(--alert-desk); }
.court-card .cc-head .umpire { font-size: 13px; font-weight: 700; color: var(--alert-desk); }

.plan { position: relative; aspect-ratio: 2.17; background: var(--surround); padding: 6% 7%; }
.plan .lines { position: absolute; inset: 6% 7%; border: 2px solid var(--line); background: var(--court); }
.plan .lines::before { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; background: var(--line); transform: translateX(-50%); opacity: 0.9; }
.plan .lines .sl { position: absolute; left: 0; right: 0; height: 2px; background: var(--line); }
.plan .lines .sl.t { top: 12.5%; } .plan .lines .sl.b { bottom: 12.5%; }
.plan .lines .sv { position: absolute; top: 12.5%; bottom: 12.5%; width: 2px; background: var(--line); }
.plan .lines .sv.l { left: 27%; } .plan .lines .sv.r { right: 27%; }
.plan .lines .cs { position: absolute; top: 12.5%; bottom: 12.5%; left: 50%; width: 2px; background: var(--line); }
.plan .lines .cs { left: 27%; right: 27%; width: auto; top: 50%; height: 2px; }
.plan .score { position: absolute; inset: 6% 7%; display: grid; grid-template-rows: 1fr 1fr; color: #fff; }
.plan .score .row { display: grid; grid-template-columns: minmax(0, 1fr) 42px 42px 52px; align-items: center; padding: 0 12px; gap: 6px; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5); }
.plan .score .row .nm { font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 8px; }
.plan .score .row .nm > span:not(.dot) { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.plan .score .row .nm .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; background: transparent; }
.plan .score .row.serving .nm .dot { background: var(--ball); }
.plan .score .row .n { font-size: 26px; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; }
.plan .score .row .n.pts { font-size: 30px; color: var(--ball); }
.plan .score .row.winner .nm { color: var(--ball); }
.plan .free-msg { position: absolute; inset: 6% 7%; display: grid; place-items: center; color: #fff; font-size: 20px; font-weight: 700; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5); text-align: center; padding: 10px; }
.plan .free-msg small { display: block; font-weight: 400; font-size: 14px; opacity: 0.9; margin-top: 4px; }
.plan.dim .lines, .plan.dim .score { opacity: 0.6; }

.court-card .cc-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; padding: 10px 14px; font-size: 14px; border-top: 1px solid var(--rule); }
.court-card .cc-meta div { display: flex; justify-content: space-between; gap: 8px; }
.court-card .cc-meta span { color: var(--muted); }
.court-card .cc-meta b { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.court-card .cc-meta b.warn { color: var(--alert-desk); }
.court-card .cc-acts { display: flex; gap: 8px; padding: 10px 14px 12px; flex-wrap: wrap; }
.court-card .cc-acts .spacer { flex: 1; }
.court-card .cc-acts a.btn { text-decoration: none; }

/* queue */
.queue-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 8px; padding: 10px 0; border-bottom: 1px solid var(--rule); align-items: center; }
.queue-item:last-child { border-bottom: 0; }
.queue-item .no { font-weight: 700; }
.queue-item .rd { color: var(--muted); font-size: 13px; }
.queue-item .who { grid-column: 1 / -1; font-size: 14px; line-height: 1.3; }
.queue-item .who .v { color: var(--muted); padding: 0 4px; }
.queue-item .asg { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.queue-item .asg .btn.sm { padding: 3px 7px; }
.add-match { display: grid; gap: 8px; border-top: 1px solid var(--rule); padding-top: 12px; margin-top: 8px; }
.add-match .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.field { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.field input, .field select { background: #fff; border: 1px solid var(--rule); border-radius: 4px; padding: 6px 8px; font-size: 14px; color: var(--ink); width: 100%; }
.field input[type=color] { padding: 0; height: 32px; width: 48px; }
.field.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: var(--ink); font-size: 14px; }
.field.row input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--court); }
.field.row select, .field.row input[type=number] { width: 120px; }

/* rules */
.rules-grid { display: grid; gap: 8px; }
.rules-grid .preset { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; }
.rules-grid .preset .btn.on { background: var(--court); border-color: var(--court); color: #fff; }
.push { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--rule); font-size: 13px; color: var(--muted); }
.push.dirty { color: var(--ink); }
.push .v { font-variant-numeric: tabular-nums; }

/* sponsors */
.sp-list { display: grid; gap: 8px; }
.sp-item { display: grid; grid-template-columns: 8px minmax(0, 1fr) auto; gap: 10px; align-items: center; background: #fff; border: 1px solid var(--rule); border-radius: 4px; padding: 8px 10px 8px 8px; }
.sp-item .sw { width: 8px; align-self: stretch; border-radius: 2px; }
.sp-item .nm { font-weight: 700; display: flex; align-items: center; gap: 8px; }
.sp-item .nm small { color: var(--muted); font-weight: 400; }
.sp-item .tg { font-size: 13px; color: var(--muted); line-height: 1.3; }
.sp-item .im { font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.sp-item .im b { display: block; font-size: 18px; }
.sp-item.off { opacity: 0.55; }
.sp-item .acts { grid-column: 2 / -1; display: flex; gap: 6px; }
.rev { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.rev div { background: #fff; border: 1px solid var(--rule); border-radius: 4px; padding: 10px; }
.rev div span { color: var(--muted); font-size: 13px; display: block; }
.rev div b { font-size: 26px; font-variant-numeric: tabular-nums; }

/* results */
.res-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.res-table th { text-align: left; font-weight: 700; color: var(--muted); font-size: 13px; padding: 6px 8px; border-bottom: 1px solid var(--rule); }
.res-table td { padding: 8px; border-bottom: 1px solid var(--rule); vertical-align: top; }
.res-table td.sc { font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 700; }
.res-table .w { font-weight: 700; }

/* =====================================================================
   Split-screen demo
   ===================================================================== */
.demo-root { height: 100%; display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); background: #0B1114; color: #fff; }
.demo-bar { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 8px 14px; background: #0B1114; border-bottom: 1px solid #22303A; font-size: 14px; }
.demo-bar b { white-space: nowrap; }
.demo-bar .btn { white-space: nowrap; }
.demo-bar b { font-size: 16px; }
.demo-bar .hint { color: #AEB7BC; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    <div id="court1"></div>
    <div class="demo-court-bar"><b>Court 2 tablet</b><span class="spacer"></span><label class="sw"><input type="checkbox" data-net="2" checked> Internet</label><button class="btn" data-auto="2">Auto-play points</button></div>
    <div id="court2"></div>
  </div>
</div>
<script>
/*
 * RallyPoint — scoring engine
 * Pure functions over a plain match object. No DOM, no timers.
 * Works in the browser (window.RallyPoint.scoring) and in Node (module.exports).
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else { root.RallyPoint = root.RallyPoint || {}; root.RallyPoint.scoring = factory(); }
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const DEFAULT_RULES = {
    preset: 'standard',
    bestOf: 3,                  // 1, 3 or 5 sets
    gamesPerSet: 6,
    noAd: false,                // deciding point at deuce
    tiebreakAt: 6,              // games-all that triggers a set tiebreak
    tiebreakTo: 7,
    finalSetMatchTiebreak: true,// 10-point tiebreak in lieu of the deciding set
    matchTiebreakTo: 10,
    express: false,             // Fast-Play: change ends, no rest periods
    serveClockSec: 25,
    changeoverSec: 90,
    setBreakSec: 120,
    timeCallSec: 80             // "Time" is called this many seconds into a changeover
  };

  const PRESETS = {
    standard: { preset: 'standard', bestOf: 3, gamesPerSet: 6, noAd: false, tiebreakAt: 6, tiebreakTo: 7, finalSetMatchTiebreak: true, express: false, changeoverSec: 90, setBreakSec: 120 },
    noad:     { preset: 'noad', bestOf: 3, gamesPerSet: 6, noAd: true, tiebreakAt: 6, tiebreakTo: 7, finalSetMatchTiebreak: true, express: false, changeoverSec: 90, setBreakSec: 120 },
    fast4:    { preset: 'fast4', bestOf: 3, gamesPerSet: 4, noAd: true, tiebreakAt: 3, tiebreakTo: 5, finalSetMatchTiebreak: true, express: true, changeoverSec: 0, setBreakSec: 0 },
    oneset:   { preset: 'oneset', bestOf: 1, gamesPerSet: 6, noAd: false, tiebreakAt: 6, tiebreakTo: 7, finalSetMatchTiebreak: false, express: false, changeoverSec: 90, setBreakSec: 120 }
  };

  const POINT_LABELS = ['0', '15', '30', '40'];
  const HISTORY_LIMIT = 80;

  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function normalizeRules(r) { return Object.assign({}, DEFAULT_RULES, r || {}); }

  function playerName(team, idx) {
    const p = team.players[idx] || team.players[0];
    return p ? p.name : '';
  }
  function teamLabel(team) {
    return team.name || team.players.map(p => p.name).join(' / ');
  }

  /* ------------------------------------------------------------------ */
  /* Construction                                                        */
  /* ------------------------------------------------------------------ */

  function createMatch(opts) {
    opts = opts || {};
    const format = opts.format === 'doubles' ? 'doubles' : 'singles';
    const perTeam = format === 'doubles' ? 2 : 1;
    const teams = (opts.teams || []).slice(0, 2).map(t => ({
      name: t.name || '',
      players: (t.players || []).slice(0, perTeam).map(p => ({ name: typeof p === 'string' ? p : (p && p.name) || '' }))
    }));
    while (teams.length < 2) teams.push({ name: '', players: [] });
    teams.forEach((t, i) => { while (t.players.length < perTeam) t.players.push({ name: 'Player ' + (i + 1) + String.fromCharCode(65 + t.players.length) }); });

    const serveOrder = format === 'doubles'
      ? [{ team: 0, player: 0 }, { team: 1, player: 0 }, { team: 0, player: 1 }, { team: 1, player: 1 }]
      : [{ team: 0, player: 0 }, { team: 1, player: 0 }];

    return {
      id: opts.id || null,
      number: opts.number || null,
      round: opts.round || '',
      format, teams,
      rules: normalizeRules(opts.rules),
      rulesVersion: opts.rulesVersion || 0,
      status: 'ready',            // ready | live | done
      sets: [],                   // [{games:[a,b], tb:[a,b]|null, matchTiebreak:bool}]
      games: [0, 0],
      points: [0, 0],
      tiebreak: null,             // {kind:'set'|'match', to, firstServeIdx}
      serveOrder,
      serveIdx: 0,
      gameFirstServeIdx: 0,
      receiveOrder: [[0, 1], [0, 1]], // per team: [deuce-court player, ad-court player]
      faults: 0,
      ends: 0,
      rest: null,                 // {kind:'changeover'|'setBreak'|'changeEnds', restSec, swap, forced}
      winner: null,
      startedAt: null,
      endedAt: null,
      history: [],
      log: [],
      seq: 0
    };
  }

  function stripped(m) {
    const s = Object.assign({}, m);
    delete s.history;
    return clone(s);
  }

  function pushHistory(m) {
    const next = stripped(m);
    next.history = (m.history || []).concat([stripped(m)]).slice(-HISTORY_LIMIT);
    return next;
  }

  function addLog(m, text, now) {
    m.log = (m.log || []).concat([{ t: now || Date.now(), text }]).slice(-40);
  }

  /**
   * Start play. firstServer = {team, player}. opponentFirstPlayer picks which
   * member of the other team serves first (doubles). receiveOrder optionally
   * fixes deuce/ad court receivers per team.
   */
  function startMatch(m, opts, now) {
    opts = opts || {};
    const st = pushHistory(m);
    const fs = opts.firstServer || { team: 0, player: 0 };
    const other = 1 - fs.team;
    const of = opts.opponentFirstPlayer == null ? 0 : opts.opponentFirstPlayer;
    if (st.format === 'doubles') {
      st.serveOrder = [
        { team: fs.team, player: fs.player },
        { team: other, player: of },
        { team: fs.team, player: 1 - fs.player },
        { team: other, player: 1 - of }
      ];
    } else {
      st.serveOrder = [{ team: fs.team, player: 0 }, { team: other, player: 0 }];
    }
    if (opts.receiveOrder) st.receiveOrder = clone(opts.receiveOrder);
    st.serveIdx = 0;
    st.gameFirstServeIdx = 0;
    st.status = 'live';
    st.startedAt = now || Date.now();
    st.rest = null;
    st.seq++;
    addLog(st, 'Match started. ' + serverName(st) + ' to serve.', now);
    return { state: st, events: [{ type: 'start' }] };
  }

  /* ------------------------------------------------------------------ */
  /* Who serves, who receives                                            */
  /* ------------------------------------------------------------------ */

  function serverOf(m) {
    const n = m.serveOrder.length;
    let idx = m.serveIdx;
    if (m.tiebreak) {
      const t = m.points[0] + m.points[1];
      idx = (m.tiebreak.firstServeIdx + Math.floor((t + 1) / 2)) % n;
    }
    const s = m.serveOrder[idx];
    return { team: s.team, player: s.player, name: playerName(m.teams[s.team], s.player), idx };
  }

  function receiverOf(m) {
    const s = serverOf(m);
    const r = 1 - s.team;
    const t = m.points[0] + m.points[1];
    const court = t % 2 === 0 ? 'deuce' : 'ad';
    const player = m.format === 'doubles' ? m.receiveOrder[r][t % 2] : 0;
    return { team: r, player, court, name: playerName(m.teams[r], player) };
  }

  function serverName(m) { return serverOf(m).name; }

  /* ------------------------------------------------------------------ */
  /* Scoring                                                              */
  /* ------------------------------------------------------------------ */

  function setsWon(m, team) {
    return m.sets.filter(s => setWinner(s) === team).length;
  }
  function setWinner(s) {
    return s.games[0] > s.games[1] ? 0 : 1;
  }
  function setsNeeded(m) { return Math.floor(m.rules.bestOf / 2) + 1; }

  function applyPoint(m, team, now) {
    if (m.status !== 'live') return { state: m, events: [] };
    now = now || Date.now();
    const st = pushHistory(m);
    const ev = [];
    const o = 1 - team;
    st.faults = 0;
    st.rest = null;
    st.points[team]++;
    ev.push({ type: 'point', team });
    const p = st.points;

    let gameWon = false;
    if (st.tiebreak) {
      const to = st.tiebreak.to;
      if (p[team] >= to && p[team] - p[o] >= 2) gameWon = true;
      else if ((p[0] + p[1]) % 6 === 0) {
        st.ends ^= 1;
        st.rest = { kind: 'changeEnds', restSec: 0, swap: true };
        ev.push({ type: 'rest', kind: 'changeEnds', restSec: 0, swap: true });
      }
    } else if (st.rules.noAd) {
      if (p[team] >= 4) gameWon = true;
    } else if (p[team] >= 4 && p[team] - p[o] >= 2) {
      gameWon = true;
    }

    if (!gameWon) {
      st.seq++;
      addLog(st, 'Point ' + teamLabel(st.teams[team]) + ' — ' + callString(st), now);
      return { state: st, events: ev };
    }

    // ---- game won ----
    const tb = st.tiebreak;
    const tbPoints = tb ? [p[0], p[1]] : null;
    st.points = [0, 0];
    st.tiebreak = null;
    const n = st.serveOrder.length;

    if (tb && tb.kind === 'match') {
      ev.push({ type: 'game', team, games: st.games.slice() });
      addLog(st, 'Match tiebreak ' + tbPoints.join('-') + ' to ' + teamLabel(st.teams[team]), now);
      return finishSet(st, team, ev, { setGames: [team === 0 ? 1 : 0, team === 1 ? 1 : 0], tb: tbPoints, matchTiebreak: true, tbFirst: tb.firstServeIdx }, now);
    }

    st.games[team]++;
    ev.push({ type: 'game', team, games: st.games.slice() });
    addLog(st, 'Game ' + teamLabel(st.teams[team]) + ' — ' + st.games.join('-'), now);
    const g = st.games;

    let setWon = false;
    if (tb) setWon = true;
    else if (g[team] >= st.rules.gamesPerSet && g[team] - g[o] >= 2) setWon = true;
    if (setWon) {
      return finishSet(st, team, ev, { setGames: g.slice(), tb: tbPoints, matchTiebreak: false, tbFirst: tb ? tb.firstServeIdx : null }, now);
    }

    // next game: rotate server
    st.serveIdx = (st.gameFirstServeIdx + 1) % n;
    st.gameFirstServeIdx = st.serveIdx;

    if (g[0] === st.rules.tiebreakAt && g[1] === st.rules.tiebreakAt) {
      st.tiebreak = { kind: 'set', to: st.rules.tiebreakTo, firstServeIdx: st.serveIdx };
      ev.push({ type: 'tiebreak', kind: 'set', to: st.rules.tiebreakTo });
      addLog(st, 'Tiebreak to ' + st.rules.tiebreakTo, now);
    }

    const total = g[0] + g[1];
    if (total % 2 === 1) {
      st.ends ^= 1;
      const restSec = (total === 1 || st.rules.express) ? 0 : st.rules.changeoverSec;
      st.rest = { kind: restSec > 0 ? 'changeover' : 'changeEnds', restSec, swap: true };
      ev.push({ type: 'rest', kind: st.rest.kind, restSec, swap: true });
    }
    st.seq++;
    return { state: st, events: ev };
  }

  function finishSet(st, team, ev, info, now) {
    const n = st.serveOrder.length;
    st.sets.push({ games: info.setGames, tb: info.tb, matchTiebreak: !!info.matchTiebreak });
    st.games = [0, 0];
    st.tiebreak = null;
    ev.push({ type: 'set', team, sets: st.sets.map(s => s.games.slice()) });
    addLog(st, (info.matchTiebreak ? 'Match tiebreak' : 'Set') + ' to ' + teamLabel(st.teams[team]) + ' (' + setLine(st) + ')', now);

    const need = setsNeeded(st);
    const won = setsWon(st, team);
    const lost = setsWon(st, 1 - team);
    if (won >= need) {
      st.status = 'done';
      st.winner = team;
      st.endedAt = now;
      st.rest = null;
      st.seq++;
      ev.push({ type: 'match', winner: team, score: setLine(st) });
      addLog(st, 'Match: ' + teamLabel(st.teams[team]) + ' wins ' + setLine(st), now);
      return { state: st, events: ev };
    }

    // The side that served first in a tiebreak receives first in the next set.
    st.serveIdx = ((info.tbFirst == null ? st.gameFirstServeIdx : info.tbFirst) + 1) % n;
    st.gameFirstServeIdx = st.serveIdx;

    const decider = st.sets.length === st.rules.bestOf - 1 && won === need - 1 && lost === need - 1;
    if (decider && st.rules.finalSetMatchTiebreak) {
      st.tiebreak = { kind: 'match', to: st.rules.matchTiebreakTo, firstServeIdx: st.serveIdx };
      ev.push({ type: 'tiebreak', kind: 'match', to: st.rules.matchTiebreakTo });
      addLog(st, 'Match tiebreak to ' + st.rules.matchTiebreakTo, now);
    }

    const totalGames = info.setGames[0] + info.setGames[1];
    const swap = totalGames % 2 === 1;
    if (swap) st.ends ^= 1;
    const restSec = st.rules.express ? 0 : st.rules.setBreakSec;
    st.rest = { kind: restSec > 0 ? 'setBreak' : 'changeEnds', restSec, swap };
    ev.push({ type: 'rest', kind: st.rest.kind, restSec, swap });
    st.seq++;
    return { state: st, events: ev };
  }

  function applyFault(m, now) {
    if (m.status !== 'live') return { state: m, events: [] };
    if (m.faults === 0) {
      const st = pushHistory(m);
      st.faults = 1;
      st.seq++;
      addLog(st, 'Fault. Second serve.', now);
      return { state: st, events: [{ type: 'fault', n: 1 }] };
    }
    const r = receiverOf(m).team;
    const res = applyPoint(m, r, now);
    res.events.unshift({ type: 'doubleFault' });
    addLog(res.state, 'Double fault.', now);
    return res;
  }

  function applyLet(m, now) {
    if (m.status !== 'live') return { state: m, events: [] };
    const st = clone(m);
    addLog(st, 'Let. Replay the serve.', now);
    return { state: st, events: [{ type: 'let' }] };
  }

  function undo(m, now) {
    if (!m.history || !m.history.length) return { state: m, events: [] };
    const prev = clone(m.history[m.history.length - 1]);
    prev.history = m.history.slice(0, -1);
    prev.seq = m.seq + 1;
    prev.log = (m.log || []).slice();
    addLog(prev, 'Correction — back to ' + callString(prev), now);
    return { state: prev, events: [{ type: 'correction' }] };
  }

  /** Manual override from the tablet: any of games, points, server index, tiebreak flag. */
  function override(m, patch, now) {
    const st = pushHistory(m);
    if (patch.games) st.games = [Math.max(0, patch.games[0] | 0), Math.max(0, patch.games[1] | 0)];
    if (patch.points) st.points = [Math.max(0, patch.points[0] | 0), Math.max(0, patch.points[1] | 0)];
    if (patch.serveIdx != null) { st.serveIdx = patch.serveIdx % st.serveOrder.length; st.gameFirstServeIdx = st.serveIdx; }
    if (patch.tiebreak === true && !st.tiebreak) st.tiebreak = { kind: 'set', to: st.rules.tiebreakTo, firstServeIdx: st.serveIdx };
    if (patch.tiebreak === false) st.tiebreak = null;
    if (patch.sets) st.sets = clone(patch.sets);
    st.faults = 0;
    st.rest = null;
    st.seq++;
    addLog(st, 'Override — ' + setLine(st, true) + ' ' + st.games.join('-') + ' (' + callString(st) + ')', now);
    return { state: st, events: [{ type: 'override' }] };
  }

  /** Organizer pushed new rules. Applies immediately to future games. */
  function setRules(m, rules, version) {
    const st = clone(m);
    st.rules = normalizeRules(Object.assign({}, m.rules, rules));
    if (version != null) st.rulesVersion = version;
    if (st.tiebreak && st.tiebreak.kind === 'set') st.tiebreak.to = st.rules.tiebreakTo;
    if (st.tiebreak && st.tiebreak.kind === 'match') st.tiebreak.to = st.rules.matchTiebreakTo;
    st.seq++;
    addLog(st, 'Rules updated by the organizer desk (v' + st.rulesVersion + ')');
    return { state: st, events: [{ type: 'rules' }] };
  }

  function forceRest(m, restSec, now) {
    const st = clone(m);
    st.rest = { kind: 'changeover', restSec: restSec == null ? m.rules.changeoverSec || 90 : restSec, swap: false, forced: true };
    st.seq++;
    addLog(st, 'Changeover forced by the court.', now);
    return { state: st, events: [{ type: 'rest', kind: 'changeover', restSec: st.rest.restSec, swap: false, forced: true }] };
  }

  function endRest(m, now) {
    const st = clone(m);
    st.rest = null;
    st.seq++;
    return { state: st, events: [{ type: 'time' }] };
  }

  /* ------------------------------------------------------------------ */
  /* Display                                                              */
  /* ------------------------------------------------------------------ */

  function pointLabels(m) {
    const p = m.points;
    if (m.tiebreak) return [String(p[0]), String(p[1])];
    if (p[0] >= 3 && p[1] >= 3) {
      if (p[0] === p[1]) return ['40', '40'];
      return p[0] > p[1] ? ['AD', '40'] : ['40', 'AD'];
    }
    return [POINT_LABELS[Math.min(p[0], 3)], POINT_LABELS[Math.min(p[1], 3)]];
  }

  function spokenLabel(p) {
    return p === 0 ? 'Love' : POINT_LABELS[p];
  }

  /** The score as the server would call it before serving. */
  function callString(m) {
    const s = serverOf(m).team;
    const r = 1 - s;
    const ps = m.points[s], pr = m.points[r];
    if (m.tiebreak) return ps === pr ? ps + ' all' : ps + '-' + pr;
    if (ps >= 3 && pr >= 3) {
      if (ps === pr) return m.rules.noAd ? 'Deuce, deciding point' : 'Deuce';
      return ps > pr ? 'Ad in' : 'Ad out';
    }
    if (ps === pr) return ps === 0 ? 'Love all' : POINT_LABELS[ps] + ' all';
    return spokenLabel(ps) + '-' + spokenLabel(pr);
  }

  function setLine(m, includeCurrent) {
    const parts = m.sets.map(s => s.matchTiebreak ? '[' + s.tb.join('-') + ']' : (s.games.join('-') + (s.tb ? '(' + Math.min(s.tb[0], s.tb[1]) + ')' : '')));
    if (includeCurrent && (m.games[0] || m.games[1] || m.points[0] || m.points[1])) parts.push(m.games.join('-'));
    return parts.join(' ');
  }

  function scoreboard(m) {
    const live = m.status !== 'ready';
    const srv = live ? serverOf(m) : null;
    const rcv = live ? receiverOf(m) : null;
    const pl = pointLabels(m);
    const decidingPoint = !m.tiebreak && m.rules.noAd && m.points[0] === 3 && m.points[1] === 3;
    const teams = m.teams.map((t, i) => ({
      label: teamLabel(t),
      players: t.players.map(p => p.name),
      sets: setsWon(m, i),
      games: m.games[i],
      points: pl[i],
      serving: !!srv && srv.team === i,
      receiving: !!rcv && rcv.team === i,
      activePlayer: srv && srv.team === i ? srv.player : (rcv && rcv.team === i ? rcv.player : null),
      activeName: srv && srv.team === i ? srv.name : (rcv && rcv.team === i ? rcv.name : ''),
      gamePoint: gamePointFor(m, i),
      winner: m.winner === i
    }));
    return {
      status: m.status,
      format: m.format,
      teams,
      sets: m.sets.map(s => ({ games: s.games.slice(), tb: s.tb ? s.tb.slice() : null, matchTiebreak: s.matchTiebreak })),
      setLine: setLine(m),
      call: live ? callString(m) : '',
      server: srv, receiver: rcv,
      tiebreak: m.tiebreak ? m.tiebreak.kind : null,
      tiebreakTo: m.tiebreak ? m.tiebreak.to : null,
      decidingPoint,
      faults: m.faults,
      rest: m.rest,
      ends: m.ends,
      rules: m.rules,
      rulesVersion: m.rulesVersion,
      seq: m.seq,
      winner: m.winner
    };
  }

  function gamePointFor(m, team) {
    const p = m.points, o = 1 - team;
    if (m.status !== 'live') return false;
    if (m.tiebreak) return p[team] >= m.tiebreak.to - 1 && p[team] - p[o] >= 1;
    if (m.rules.noAd) return p[team] === 3;
    return p[team] >= 3 && p[team] - p[o] >= 1;
  }

  /* ------------------------------------------------------------------ */
  /* Voice-call reconciliation                                            */
  /* ------------------------------------------------------------------ */

  function scoreKey(m, events) {
    if (events && events.some(e => e.type === 'game')) return ['game'];
    const s = serverOf(m).team;
    const ps = m.points[s], pr = m.points[1 - s];
    if (m.tiebreak) return ['tb:' + ps + '-' + pr];
    if (ps >= 3 && pr >= 3) {
      if (ps === pr) return ['deuce'];
      return [ps > pr ? 'adin' : 'adout'];
    }
    return [POINT_LABELS[ps] + '-' + POINT_LABELS[pr]];
  }

  function assertionKey(m, a) {
    if (a.kind === 'deuce') return 'deuce';
    if (a.kind === 'adIn') return 'adin';
    if (a.kind === 'adOut') return 'adout';
    if (a.kind === 'game') return 'game';
    if (a.kind === 'score') {
      if (m.tiebreak && !a.words) return 'tb:' + a.a + '-' + a.b;
      if (m.tiebreak && a.words) return 'tb:' + a.a + '-' + a.b; // "fifteen" in a tiebreak is a misfire; will not match
      const ok = v => [0, 15, 30, 40].indexOf(v) >= 0;

    }

      enqueue(msg);
      return false;
    }
    function rawSend(msg) {

    /* ---------------- WebSocket ---------------- */
    function connectWs() {

      setStatus('connecting');

    /* ---------------- in-page demo link ---------------- */
    function connectLocal() {
