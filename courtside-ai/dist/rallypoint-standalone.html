          if (st.phase === 'ready') return startMatch();
          return;
        case 'pointServer': if (m && st.phase === 'live') { doPoint(S.serverOf(m).team, 'voice'); toast('Point to the server. ' + S.callString(st.match) + '.', 'ok', { label: 'Undo', action: 'correction' }, 4000); } return;
        case 'pointReceiver': if (m && st.phase === 'live') { doPoint(S.receiverOf(m).team, 'voice'); toast('Point to the receiver. ' + S.callString(st.match) + '.', 'ok', { label: 'Undo', action: 'correction' }, 4000); } return;
      }
    }

    function speak(text) {
      const ms = A.speak(text, { lang: st.settings.lang });
      if (ms) rec.mute(ms + 300);   // do not let the tablet transcribe itself
    }
    function announce(text) { if (st.settings.announce) speak(text); }

    /* ------------------------------------------------------------ */
    /* match actions                                                */
    /* ------------------------------------------------------------ */
    function startMatch() {
      if (!st.match || st.phase !== 'ready') return;
      const r = S.startMatch(st.match, { firstServer: st.firstServer, opponentFirstPlayer: st.oppFirst });
      st.match = r.state; st.phase = 'live';
      resetServeClock();
      A.cues.game();
      announce(S.serverOf(st.match).name + ' to serve. Love all.');
      if (st.settings.voiceAuto && rec.supported && rec.status === 'idle') rec.start();
      sendState(); render();
    }

    function clearRestQuietly() {
      // a point or fault called during a rest means play has resumed
      if (!st.restEndsAt) return;
      st.restEndsAt = 0; st.timeFlashUntil = 0; A.stopSpeaking();
    }
    function doPoint(team, source) {
      if (!st.match || st.phase !== 'live') return;
      clearRestQuietly();
      const r = S.applyPoint(st.match, team);
      st.match = r.state;
      afterEvents(r.events, source);
    }
    function doFault() {
      if (!st.match || st.phase !== 'live') return;
      clearRestQuietly();
      const r = S.applyFault(st.match);
      st.match = r.state;
      if (r.events.some(e => e.type === 'doubleFault')) { toast('Double fault. ' + S.callString(st.match) + '.', 'ok', { label: 'Undo', action: 'correction' }, 4000); }
      else { A.cues.confirm(); announce('Fault'); toast('Fault. Second serve.', 'ok', { label: 'Undo', action: 'correction' }, 2500); }
      afterEvents(r.events.filter(e => e.type !== 'fault'), 'tap');
    }
    function doUndo() {
      if (!st.match || !st.match.history || !st.match.history.length) { toast('Nothing to correct yet.', 'bad', null, 2000); return; }
      const wasDone = st.match.status === 'done';
      st.match = S.undo(st.match).state;
      if (wasDone || st.phase === 'done') st.phase = 'live';
      st.restEndsAt = 0; st.modal = null;
      A.cues.warn();
      announce('Correction. ' + S.callString(st.match));
      toast('Correction. Score is ' + S.callString(st.match) + '.', 'ok', null, 3000);
      sendState(); render();
    }
    function afterEvents(events, source) {
      const m = st.match;
      let spoken = null;
      events.forEach(ev => {
        if (ev.type === 'game') A.cues.game();
        if (ev.type === 'tiebreak') { toast((ev.kind === 'match' ? 'Match tiebreak' : 'Tiebreak') + ' to ' + ev.to + '. First to ' + ev.to + ' by two.', 'ok', null, 4000); spoken = (ev.kind === 'match' ? 'Match tiebreak' : 'Tiebreak') + ' to ' + ev.to; }
        if (ev.type === 'match') { st.phase = 'done'; st.restEndsAt = 0; spoken = 'Game, set and match, ' + shortNames(m.teams[ev.winner]) + '. ' + ev.score; }
        if (ev.type === 'rest') {
          if (ev.restSec > 0) startRest(ev.kind, ev.restSec);
          else if (ev.swap) { toast('Change ends.' + (ev.kind === 'changeEnds' && m.rules.express ? ' No rest in express mode.' : ''), 'ok', null, 3000); spoken = spoken || 'Change ends'; }
        }
      });
      if (st.phase === 'live') resetServeClock();
      if (spoken) announce(spoken);
      else if (st.phase === 'live' && !st.restEndsAt && source !== 'voice') announce(S.callString(m));
      else if (st.phase === 'live' && !st.restEndsAt && source === 'voice' && m.points[0] + m.points[1] === 0) announce('Game. ' + S.callString(m));
      sendState(); render();
    }

    function resetServeClock() {
      const secs = st.match ? st.match.rules.serveClockSec : 25;
      st.serveClockEndsAt = Date.now() + secs * 1000; st.serveClockBeeped = false;
    }

    function startRest(kind, restSec) {
      st.restKind = kind; st.restStartedAt = Date.now(); st.restEndsAt = st.restStartedAt + restSec * 1000;
      st.timeCalled = false; st.adIdx = -1; st.adNextAt = 0;
      A.cues.alert();
      speak((kind === 'setBreak' ? 'Set break. ' : 'Changeover. ') + restSec + ' seconds.');
    }
    function endRest(byUser) {
      st.restEndsAt = 0; st.timeFlashUntil = 0;
      if (st.match && st.phase === 'live') { st.match = S.endRest(st.match).state; resetServeClock(); announce((byUser ? 'Time. ' : '') + S.serverOf(st.match).name + ' to serve. ' + S.callString(st.match)); }
      A.stopSpeaking();
      sendState(); render();
    }
    function forceChangeover() {
      if (!st.match || st.phase !== 'live') return;
      const secs = st.match.rules.changeoverSec || 90;
      st.match = S.forceRest(st.match, secs).state;
      startRest('changeover', secs);
      sendState(); render();
    }
    function callUmpire() {
      sendEvent({ kind: 'umpire', note: st.match ? S.setLine(st.match, true) + ' ' + S.callString(st.match) : '' });
      st.modal = { type: 'umpire' };
      A.cues.alert(); render();
    }

    /* ------------------------------------------------------------ */
    /* toast                                                        */
    /* ------------------------------------------------------------ */
    function toast(text, kind, action, ms) {
      clearTimeout(toastTimer);
      st.toast = { text, kind: kind || 'ok', action, ms: ms || 3000, at: Date.now() };
      toastTimer = setTimeout(() => { st.toast = null; render(); }, st.toast.ms);
      render();
    }

    /* ------------------------------------------------------------ */
    /* timers                                                       */
    /* ------------------------------------------------------------ */
    function tick() {
      const now = Date.now();
      if (st.restEndsAt) {
        const m = st.match;
        const timeAt = st.restStartedAt + (m ? m.rules.timeCallSec : 80) * 1000;
        if (!st.timeCalled && now >= timeAt && st.restEndsAt - st.restStartedAt > (m ? m.rules.timeCallSec : 80) * 1000) {
          st.timeCalled = true; st.timeFlashUntil = now + 1800;
          A.cues.time(); speak('Time');
          render();
        }
        if (st.timeFlashUntil && now > st.timeFlashUntil) { st.timeFlashUntil = 0; render(); }
        if (now >= st.restEndsAt) { endRest(false); return; }
        const clock = rootEl.querySelector('#rest-clock');
        if (clock) { clock.textContent = mmss(st.restEndsAt - now); clock.classList.toggle('time', st.timeCalled); }
        // sponsor loop
        const sponsors = activeSponsors();
        if (sponsors.length && now >= st.adNextAt && st.restEndsAt - now > 4000) {
          st.adIdx = (st.adIdx + 1) % sponsors.length;
          const sp = sponsors[st.adIdx];
          st.adNextAt = now + (sp.durationSec || 12) * 1000;
          sendEvent({ kind: 'impression', sponsorId: sp.id });
          if (st.settings.sponsorAudio && sp.audio && !st.timeCalled) speak(sp.audio);
          render();
        }
      } else if (st.phase === 'live' && st.serveClockEndsAt) {
        const el = rootEl.querySelector('#serve-clock');
        const rem = st.serveClockEndsAt - now;
        if (el) {
          el.querySelector('.val').textContent = String(Math.max(0, Math.ceil(rem / 1000)));
          el.classList.toggle('warn', rem <= 5000 && rem > 0);
          el.classList.toggle('late', rem <= 0);
        }
        if (rem <= 0 && !st.serveClockBeeped) { st.serveClockBeeped = true; A.cues.serveClock(); }
      }
    }
    function activeSponsors() { return ((st.tournament && st.tournament.sponsors) || []).filter(s => s.enabled !== false); }

    /* ------------------------------------------------------------ */
    /* render                                                       */
    /* ------------------------------------------------------------ */
    function render() {
      rootEl.classList.toggle('glare', !!st.settings.glare);
      const parts = [renderTop()];
      if (st.phase === 'free') parts.push(renderFree());
      else if (st.phase === 'ready') parts.push(renderReady());
      else if (st.phase === 'done') parts.push(renderDone());
      else parts.push(renderLive());
      if (st.phase === 'live' || st.phase === 'ready') parts.push(renderVoice());
      if (st.restEndsAt > Date.now()) parts.push(renderRest());
      if (st.modal) parts.push(renderModal());
      if (st.toast) parts.push(renderToast());
      if (st.settingsOpen) parts.push(renderSettings());
      rootEl.innerHTML = parts.join('');
      const tin = rootEl.querySelector('#typed-call');
      if (tin && st._typedFocus) { tin.focus(); st._typedFocus = false; }
      const bar = rootEl.querySelector('[data-shrink]');
      if (bar) requestAnimationFrame(() => { bar.style.width = '0%'; });
    }
    function renderTopOnly() { const el = rootEl.querySelector('.ct-top'); if (el) el.outerHTML = renderTop(); else render(); }
    function renderVoiceOnly() {
      const el = rootEl.querySelector('.ct-voice');
      if (!el || !(st.phase === 'live' || st.phase === 'ready')) return;
      const input = el.querySelector('#typed-call');
      const typed = input ? input.value : '', hadFocus = input && document.activeElement === input;
      el.outerHTML = renderVoice();
      const again = rootEl.querySelector('#typed-call');
      if (again && typed) again.value = typed;
      if (again && hadFocus) again.focus();
    }

    function renderTop() {
      const t = st.tournament;
      const net = st.net.status === 'online' ? 'net-online' : (st.net.status === 'offline' ? 'net-offline' : 'net-connecting');
      const netLabel = st.net.status === 'online' ? 'Synced' + (st.net.mode === 'local' ? ' (demo link)' : '') : (st.net.status === 'offline' ? 'Offline' + (st.net.queued ? ' · ' + st.net.queued + ' queued' : ' · scoring locally') : 'Connecting');
      const v = st.voice.status;
      const vcls = v === 'listening' || v === 'starting' ? 'voice-on' : (v === 'blocked' || v === 'unsupported' ? 'voice-blocked' : 'voice-off');
      const vlabel = v === 'listening' ? 'Voice active' : v === 'starting' ? 'Voice starting' : v === 'blocked' ? 'Mic blocked' : v === 'unsupported' ? 'No voice in this browser' : 'Voice off';
      return '<div class="ct-top">' +
        '<span class="id">Court ' + esc(courtId) + '</span>' +
        (st.match ? '<span>Match #' + esc(st.match.number) + '</span>' : '') +
        '<span class="tour">' + esc(t ? t.name : 'Waiting for the organizer desk') + '</span>' +
        '<span class="pill ' + (st.phase === 'live' ? 'live' : '') + '">' + (st.phase === 'live' ? 'Live' : st.phase === 'ready' ? 'Ready' : st.phase === 'done' ? 'Finished' : 'Free') + '</span>' +
        '<span class="pill ' + vcls + '">' + vlabel + '</span>' +
        '<span class="pill ' + net + '">' + netLabel + '</span>' +
        '<button class="ctl" data-action="settings" style="font-size:calc(2 * var(--u));min-height:0;padding:calc(0.5 * var(--u)) calc(1 * var(--u))" aria-label="Settings">Settings</button>' +
        '</div>';
    }

    function renderFree() {
      return '<div class="ct-center"><div class="msg"><h2>No match on this court</h2><p>The organizer desk assigns matches from the queue. This tablet will switch to the ready screen the moment one arrives.</p>' +
        '<p>' + (st.net.status === 'online' ? 'Connected to the desk.' : 'Not connected yet — the tablet keeps working and syncs when the link is back.') + '</p></div></div>';
    }

    function renderReady() {
      const m = st.match, r = m.rules;
      const ruleBits = [
        r.bestOf === 1 ? 'One set' : 'Best of ' + r.bestOf,
        r.gamesPerSet + '-game sets',
        r.noAd ? 'No-Ad' : 'Ad scoring',
        r.tiebreakTo + '-point tiebreak at ' + r.tiebreakAt + '-' + r.tiebreakAt,
        r.finalSetMatchTiebreak && r.bestOf > 1 ? r.matchTiebreakTo + '-point match tiebreak' : 'Full deciding set',
        r.express ? 'Express — no rest periods' : r.changeoverSec + ' s changeovers',
        r.serveClockSec + ' s serve clock'
      ];
      const opt = (team, player, on) => '<button class="ctl ' + (on ? 'on' : '') + '" data-action="first-server" data-team="' + team + '" data-player="' + player + '">' + esc(m.teams[team].players[player].name) + '</button>';
      let choose = '<div class="choose"><div class="grp"><div class="lbl">Who serves first</div><div class="opts">';
      m.teams.forEach((t, ti) => t.players.forEach((p, pi) => { choose += opt(ti, pi, st.firstServer.team === ti && st.firstServer.player === pi); }));
      choose += '</div></div>';
      if (m.format === 'doubles') {
        const ot = 1 - st.firstServer.team;
        choose += '<div class="grp"><div class="lbl">First server for ' + esc(shortNames(m.teams[ot])) + '</div><div class="opts">' +
          m.teams[ot].players.map((p, pi) => '<button class="ctl ' + (st.oppFirst === pi ? 'on' : '') + '" data-action="opp-first" data-player="' + pi + '">' + esc(p.name) + '</button>').join('') + '</div></div>';
      }
      choose += '</div>';
      return '<div class="ct-center"><div class="msg">' +
        '<p>Match #' + esc(m.number) + (m.round ? ' · ' + esc(m.round) : '') + ' · ' + (m.format === 'doubles' ? 'Doubles' : 'Singles') + '</p>' +
        '<div class="vs">' + esc(shortNames(m.teams[0])) + '<div class="v">against</div>' + esc(shortNames(m.teams[1])) + '</div>' +
        '<div class="rules">' + ruleBits.map(esc).join(' · ') + '</div>' +
        choose +
        '<button class="bigbtn" style="display:inline-flex;text-align:center;align-items:center" data-action="start">Start match<small>Voice starts with it. Say “play” or tap.</small></button>' +
        '</div></div>';
    }

    function renderDone() {
      const m = st.match;
      const sent = st.net.status === 'online';
      return '<div class="ct-center"><div class="msg"><p>Match #' + esc(m.number) + ' · finished in ' + Math.round(S.durationSec(m) / 60) + ' min</p>' +
        '<div class="final">' + esc(shortNames(m.teams[m.winner])) + '</div><p>defeats ' + esc(shortNames(m.teams[1 - m.winner])) + '</p>' +
        '<div class="final" style="color:var(--ball)">' + esc(S.setLine(m)) + '</div>' +
        '<p>' + (sent ? 'Result sent to the organizer desk.' : 'Result saved on this tablet — it will reach the desk when the link is back.') + '</p>' +
        '<div style="display:flex;gap:calc(1 * var(--u));justify-content:center;flex-wrap:wrap"><button class="ctl warn" data-action="correction">Correction</button><button class="bigbtn" style="display:inline-flex;text-align:center" data-action="clear">Clear court<small>Ready for the next match</small></button></div>' +
        '</div></div>';
    }

    function renderLive() {
      const m = st.match, sb = S.scoreboard(m);
      const prev = sb.sets.length ? '<div class="prev-sets">Sets: ' + sb.sets.map(s => '<b>' + (s.matchTiebreak ? '[' + s.tb.join('-') + ']' : s.games.join('-') + (s.tb ? '(' + Math.min(s.tb[0], s.tb[1]) + ')' : '')) + '</b>').join(' &nbsp; ') + '</div>' : '';
      const row = (t, i) => {
        const role = t.serving ? 'Serving: ' + t.activeName : (t.receiving ? 'Receiving: ' + t.activeName + (m.format === 'doubles' && sb.receiver ? ' (' + sb.receiver.court + ' court)' : '') : '');
        const gp = t.gamePoint ? (sb.tiebreak ? (sb.tiebreak === 'match' ? ' · match point' : ' · set point') : ' · game point') : '';
        return '<div class="team-row"><div class="team ' + (t.serving ? 'serving' : '') + '"><div class="names"><span class="dot"></span><span>' + esc(wallLabel(m.teams[i])) + '</span></div><div class="role' + (t.gamePoint ? ' gp' : '') + '">' + esc(role) + esc(gp) + '</div></div>' +
          '<div class="num">' + t.sets + '</div><div class="num">' + t.games + '</div><div class="num pts">' + esc(t.points) + '</div></div>';
      };
      const mode = [m.rules.noAd ? 'No-Ad' : 'Ad', m.rules.express ? 'Express' : (m.rules.bestOf === 1 ? 'One set' : 'Best of ' + m.rules.bestOf), m.rules.finalSetMatchTiebreak && m.rules.bestOf > 1 ? m.rules.matchTiebreakTo + '-pt 3rd TB' : ''].filter(Boolean).join(' · ');
      const tbNote = sb.tiebreak ? '<b>' + (sb.tiebreak === 'match' ? 'Match tiebreak' : 'Tiebreak') + ' to ' + sb.tiebreakTo + '</b><br>' : '';
      const faultNote = sb.faults ? '<b>Second serve</b><br>' : '';
      const deciding = sb.decidingPoint ? '<b>Deciding point — receiver picks the side</b><br>' : '';
      return '<div class="ct-board"><div class="wall">' +
        '<div class="head first">' + esc(m.round || (m.format === 'doubles' ? 'Doubles' : 'Singles')) + '</div><div class="head">Sets</div><div class="head">Games</div><div class="head">Points</div>' +
        row(sb.teams[0], 0) + '<div class="sep"></div>' + row(sb.teams[1], 1) + prev +
        '</div><div class="ct-side">' +
        '<div class="serve-clock" id="serve-clock"><div class="lbl">Serve clock</div><div class="val">' + Math.max(0, Math.ceil((st.serveClockEndsAt - Date.now()) / 1000)) + '</div></div>' +
        '<div class="call">' + esc(sb.call) + '<small>' + esc(sb.server ? sb.server.name + ' serving' : '') + '</small></div>' +
        '<div class="mode">' + tbNote + faultNote + deciding + esc(mode) + '</div>' +
        '</div></div>' +
        '<div class="ct-controls"><div class="points">' +
        '<button class="bigbtn" data-action="point" data-team="0">Point ' + esc(sb.teams[0].label) + '<small>' + esc(sb.teams[0].serving ? 'server' : 'receiver') + '</small></button>' +
        '<button class="bigbtn" data-action="point" data-team="1">Point ' + esc(sb.teams[1].label) + '<small>' + esc(sb.teams[1].serving ? 'server' : 'receiver') + '</small></button>' +
        '</div><div class="row">' +
        '<button class="ctl" data-action="fault">' + (sb.faults ? 'Double fault' : 'Fault') + '</button>' +
        '<button class="ctl" data-action="let">Let</button>' +
        '<button class="ctl warn" data-action="correction"' + (m.history.length ? '' : ' disabled') + '>Correction</button>' +
        '<button class="ctl" data-action="override">Override</button>' +
        '<button class="ctl" data-action="changeover">Force changeover</button>' +
        '<button class="ctl danger" data-action="umpire">Call umpire</button>' +
        '</div></div>';
    }

    function renderVoice() {
      const v = st.voice, s = v.status;
      const btnCls = s === 'listening' || s === 'starting' ? (st.settings.arm && !rec.armed ? 'on' : (st.settings.arm ? 'armed' : 'on')) : (s === 'blocked' || s === 'unsupported' ? 'blocked' : '');
      const label = s === 'listening' ? (st.settings.arm ? (rec.armed ? 'Armed — say the score' : 'Tap to arm') : 'Listening · ' + st.settings.lang) : s === 'starting' ? 'Starting mic' : s === 'blocked' ? 'Microphone blocked in this browser' : s === 'unsupported' ? 'Voice needs Chrome, Edge or Safari' : 'Tap to start voice';
      const heard = v.interim ? '<div class="t">Hearing <q>' + esc(v.interim) + '</q>…</div>' : (v.transcript ? '<div class="t">Heard <q>' + esc(v.transcript) + '</q></div>' : '<div class="t">Say the score before you serve, server first: “30-15”, “deuce”, “ad in”, “game”. Or “fault”, “let”, “correction”, “umpire”.</div>');
      const res = v.result ? '<div class="r ' + esc(v.kind) + '">' + esc(v.result) + '</div>' : '';
      return '<div class="ct-voice"><div class="mic"><button class="' + btnCls + '" data-action="mic" aria-label="Voice"><svg width="55%" height="55%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button><span>' + esc(label) + '</span></div>' +
        '<div class="heard">' + heard + res + '</div>' +
        '<form class="typed" data-action="typed"><input id="typed-call" placeholder="Type a call, e.g. 30-15" autocomplete="off"><button type="submit">Send</button></form></div>';
    }

    function renderRest() {
      const m = st.match;
      const sponsors = activeSponsors();
      const sp = sponsors.length && st.adIdx >= 0 ? sponsors[st.adIdx % sponsors.length] : null;
      const kindLabel = st.restKind === 'setBreak' ? 'Set break' : 'Changeover';
      const sb = m ? S.scoreboard(m) : null;
      const scoreLine = sb ? wallLabel(m.teams[0]) + ' ' + sb.teams[0].games + '–' + sb.teams[1].games + ' ' + wallLabel(m.teams[1]) + (sb.sets.length ? ' · sets ' + sb.teams[0].sets + '–' + sb.teams[1].sets : '') + (sb.setLine ? ' · ' + sb.setLine : '') : '';
      const ad = sp
        ? '<div class="ad" style="background:' + esc(sp.colour) + ';color:' + esc(sp.text || '#fff') + '"><div class="who">Court-side sponsor · ' + esc(st.tournament ? st.tournament.name : '') + '</div><div class="body">' + (sp.imageUrl ? '<img src="' + esc(sp.imageUrl) + '" alt="">' : '') + '<div class="name">' + esc(sp.name) + '</div><div class="tag">' + esc(sp.tagline) + '</div></div>' +
          '<div class="foot"><div class="dots">' + sponsors.map((x, i) => '<i class="' + (i === st.adIdx % sponsors.length ? 'on' : '') + '"></i>').join('') + '</div><div class="score">' + esc(scoreLine) + '</div></div></div>'
        : '<div class="ad" style="background:#0A0C0E"><div class="who">' + esc(st.tournament ? st.tournament.name : '') + '</div><div class="body"><div class="name">' + esc(kindLabel) + '</div><div class="tag">' + esc(scoreLine) + '</div></div><div class="foot"><span></span><span class="score">Sponsors added on the organizer desk appear here.</span></div></div>';
      return '<div class="ct-overlay"><div class="bar"><div class="k">' + esc(kindLabel) + '<small>Time is called at ' + (m ? m.rules.timeCallSec : 80) + ' s · ' + esc(sb && sb.server ? sb.server.name + ' serves next' : '') + '</small></div><div class="clock' + (st.timeCalled ? ' time' : '') + '" id="rest-clock">' + mmss(st.restEndsAt - Date.now()) + '</div></div>' +
        ad +
        '<div class="actions"><button class="ctl on" data-action="end-rest">Resume play</button><button class="ctl" data-action="correction">Correction</button><button class="ctl danger" data-action="umpire">Call umpire</button></div>' +
        (st.timeFlashUntil > Date.now() ? '<div class="timecall">TIME</div>' : '') +
        '</div>';
    }

    function renderModal() {
      const mo = st.modal, m = st.match;
      let inner = '';
      if (mo.type === 'ambiguous') {
        inner = '<h3>Who won that game?</h3><p>' + esc(mo.text) + '</p><div class="btns">' + mo.teams.map(t => '<button class="bigbtn" data-action="resolve" data-team="' + t + '">' + esc(shortNames(m.teams[t])) + '</button>').join('') + '<button class="ctl" data-action="close-modal">Cancel</button></div>';
      } else if (mo.type === 'umpire') {
        inner = '<h3>Tournament director called</h3><p>The organizer desk has been alerted with the current score. Play stops until they arrive. Use Correction or Override if the score needs fixing first.</p><div class="btns"><button class="ctl" data-action="override">Override score</button><button class="ctl on" data-action="close-modal">Back to the match</button></div>';
      } else if (mo.type === 'override') {
        const o = mo.draft;
        const stepper = (lbl, k, i) => '<div class="stepper"><div class="lbl">' + esc(lbl) + '</div><div class="ctr"><button class="ctl" data-action="ov" data-k="' + k + '" data-i="' + i + '" data-d="-1">−</button><div class="v">' + o[k][i] + '</div><button class="ctl" data-action="ov" data-k="' + k + '" data-i="' + i + '" data-d="1">+</button></div></div>';
        const ptLbl = i => (o.tiebreak ? 'Tiebreak points' : 'Points (0 15 30 40 AD)') + ' · ' + shortNames(m.teams[i]);
        inner = '<h3>Override the score</h3><p>Set games and points directly. The change is logged and can be corrected.</p><div class="grid">' +
          stepper('Games · ' + shortNames(m.teams[0]), 'games', 0) + stepper('Games · ' + shortNames(m.teams[1]), 'games', 1) +
          stepper(ptLbl(0), 'points', 0) + stepper(ptLbl(1), 'points', 1) + '</div>' +
          '<div class="grid"><div class="stepper"><div class="lbl">Server</div><div class="opts" style="display:flex;flex-wrap:wrap;gap:calc(0.6 * var(--u))">' + m.serveOrder.map((s, i) => '<button class="ctl ' + (o.serveIdx === i ? 'on' : '') + '" data-action="ov-server" data-i="' + i + '">' + esc(m.teams[s.team].players[s.player].name) + '</button>').join('') + '</div></div>' +
          '<div class="stepper"><div class="lbl">Tiebreak</div><button class="ctl ' + (o.tiebreak ? 'on' : '') + '" data-action="ov-tb">' + (o.tiebreak ? 'In a tiebreak' : 'Not in a tiebreak') + '</button></div></div>' +
          '<div class="btns"><button class="ctl" data-action="close-modal">Cancel</button><button class="ctl on" data-action="ov-apply">Apply override</button></div>';
      }
      return '<div class="ct-modal"><div class="box">' + inner + '</div></div>';
    }

    function renderToast() {
      const t = st.toast;
      const btn = t.action ? '<button data-action="toast-action">' + esc(t.action.label) + '</button>' : '';
      const left = Math.max(0, t.ms - (Date.now() - t.at));
      return '<div class="ct-toast ' + esc(t.kind) + '"><span>' + esc(t.text) + '</span>' + btn + '<div class="bar" style="width:100%;transition-duration:' + left + 'ms" data-shrink></div></div>';
    }

    function renderSettings() {
      const s = st.settings;
      const chk = (k, lbl) => '<label>' + esc(lbl) + '<input type="checkbox" data-setting="' + k + '"' + (s[k] ? ' checked' : '') + '></label>';
      const log = st.match && st.match.log ? st.match.log.slice().reverse().slice(0, 12).map(l => '<div>' + new Date(l.t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + ' ' + esc(l.text) + '</div>').join('') : '<div>No match yet.</div>';
      return '<div class="ct-settings"><h3>This tablet</h3>' +
        '<label>Voice language<select data-setting="lang"><option value="en-CA"' + (s.lang === 'en-CA' ? ' selected' : '') + '>English (Canada)</option><option value="fr-CA"' + (s.lang === 'fr-CA' ? ' selected' : '') + '>Français (Canada)</option><option value="en-US"' + (s.lang === 'en-US' ? ' selected' : '') + '>English (US)</option></select></label>' +
        '<label>Wake word (optional)<input type="text" data-setting="wakeWord" value="' + esc(s.wakeWord) + '" placeholder="e.g. court ' + esc(courtId) + '"></label>' +
        chk('arm', 'Tap the mic before each call (noisy courts)') +
        chk('voiceAuto', 'Start listening when a match starts') +
        chk('announce', 'Read the score aloud after each point') +
        chk('sponsorAudio', 'Read sponsor messages during changeovers') +
        chk('glare', 'Sun glare mode (brighter text)') +
        '<div class="log"><b>Match log</b>' + log + '</div>' +
        '<button class="ctl on close" data-action="settings">Close</button></div>';
    }

    /* ------------------------------------------------------------ */
    /* events                                                       */
    /* ------------------------------------------------------------ */
    rootEl.addEventListener('click', e => {
      const b = e.target.closest('[data-action]');
      if (!b || b.tagName === 'FORM') return;
      A.unlock();
      const act = b.dataset.action;
      const m = st.match;
      switch (act) {
        case 'settings': st.settingsOpen = !st.settingsOpen; render(); break;
        case 'first-server': st.firstServer = { team: +b.dataset.team, player: +b.dataset.player }; render(); break;
        case 'opp-first': st.oppFirst = +b.dataset.player; render(); break;
        case 'start': startMatch(); break;
        case 'point': { const team = +b.dataset.team; doPoint(team, 'tap'); toast('Point ' + shortNames(st.match.teams[team]) + '. ' + (st.phase === 'live' ? S.callString(st.match) : ''), 'ok', { label: 'Undo', action: 'correction' }, 3500); break; }
        case 'fault': doFault(); break;
        case 'let': runCommand('let'); break;
        case 'correction': doUndo(); break;
        case 'override': if (m) { st.modal = { type: 'override', draft: { games: m.games.slice(), points: m.points.slice(), serveIdx: S.serverOf(m).idx, tiebreak: !!m.tiebreak } }; render(); } break;
        case 'ov': { const d = st.modal.draft; d[b.dataset.k][+b.dataset.i] = Math.max(0, d[b.dataset.k][+b.dataset.i] + (+b.dataset.d)); render(); break; }
        case 'ov-server': st.modal.draft.serveIdx = +b.dataset.i; render(); break;
        case 'ov-tb': st.modal.draft.tiebreak = !st.modal.draft.tiebreak; render(); break;
        case 'ov-apply': { const d = st.modal.draft; st.match = S.override(m, { games: d.games, points: d.points, serveIdx: d.serveIdx, tiebreak: d.tiebreak }).state; st.modal = null; st.restEndsAt = 0; resetServeClock(); announce('Override. ' + S.callString(st.match)); sendState(); render(); break; }
        case 'changeover': forceChangeover(); break;
        case 'umpire': callUmpire(); break;
        case 'end-rest': endRest(true); break;
        case 'clear': clearCourt(true); break;
        case 'resolve': doPoint(+b.dataset.team, 'voice'); st.modal = null; render(); break;
        case 'close-modal': st.modal = null; render(); break;
        case 'mic': toggleMic(); break;
        case 'toast-action': { const a = st.toast && st.toast.action; st.toast = null; if (a) { if (a.action === 'correction') doUndo(); else if (a.action === 'force' && m) { st.match = S.applyAssertionAsOverride(m, a.assertion).state; announce('Override. ' + S.callString(st.match)); sendState(); render(); } } else render(); break; }
      }
    });
    rootEl.addEventListener('submit', e => {
      const f = e.target.closest('form[data-action="typed"]');
      if (!f) return;
      e.preventDefault();
      const input = f.querySelector('input');
      const text = input.value.trim();
      if (!text) return;
      A.unlock();
      st._typedFocus = true;
      rec.feedText(text);
      input.value = '';
    });
    rootEl.addEventListener('change', e => {
      const el = e.target.closest('[data-setting]');
      if (!el) return;
      const k = el.dataset.setting;
      st.settings[k] = el.type === 'checkbox' ? el.checked : el.value;
      saveSettings();
      if (k === 'lang') rec.setLang(st.settings.lang);
      if (k === 'wakeWord') rec.setWakeWord(st.settings.wakeWord);
      if (k === 'arm') rec.arm(!st.settings.arm);
      render();
    });
    function toggleMic() {
      if (!rec.supported) { toast('Voice recognition needs Chrome, Edge or Safari. The buttons do everything voice does.', 'bad', null, 4000); return; }
      if (typeof window !== 'undefined' && window.isSecureContext === false) { toast('Voice needs HTTPS: open this tablet over https:// (run `npm run cert` + `npm run start:https` on the hub). The buttons work meanwhile.', 'bad', null, 6000); return; }
      if (rec.status === 'listening' || rec.status === 'starting') {
        if (st.settings.arm && !rec.armed) { rec.arm(true); renderVoiceOnly(); return; }
        rec.stop();
      } else rec.start();
      renderVoiceOnly();
    }

    /* ------------------------------------------------------------ */
    /* demo / automation hooks                                      */
    /* ------------------------------------------------------------ */
    let autoTimer = null;
    const api = {
      courtId, transport, state: st, render, rec,
      point: team => doPoint(team, 'tap'),
      say: text => rec.feedText(text),
      start: () => { st.phase === 'ready' && startMatch(); },
      setOnline: on => transport.setOnline(on),
      autoplay(on, intervalMs) {
        clearInterval(autoTimer); autoTimer = null;
        if (!on) return;
        autoTimer = setInterval(() => {
          if (st.phase === 'ready') return startMatch();
          if (st.phase !== 'live' || st.restEndsAt || st.modal) return;
          const srv = S.serverOf(st.match).team;
          doPoint(Math.random() < 0.6 ? srv : 1 - srv, 'auto');
        }, intervalMs || 1200);
      },
      destroy() { clearInterval(tickTimer); clearInterval(hbTimer); clearInterval(autoTimer); rec.stop(); transport.close(); }
    };

    tickTimer = setInterval(tick, 250);
    hbTimer = setInterval(() => { if (st.phase !== 'free') sendState(); }, 15000);
    render();
    if (st.phase === 'live') { resetServeClock(); if (st.settings.voiceAuto && rec.supported) rec.start(); }
    return api;
  }

  root.RallyPoint.createCourtApp = createCourtApp;
})(typeof self !== 'undefined' ? self : this);

</script>
<script>
/*
 * RallyPoint — organizer desk
 * createOrganizerApp(rootElement, { localHub?, mode?, wsUrl?, courts? })
 */
(function (root) {
  'use strict';
  const S = root.RallyPoint.scoring, H = root.RallyPoint.hub, A = root.RallyPoint.audio, SY = root.RallyPoint.sync;

  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const names = t => t.players.map(p => p.name).join(' / ');
  const shortLabel = tm => { const parts = String(tm.label || '').split(' / '); return parts.length > 1 ? parts.map(n => n.trim().split(' ').pop()).join(' / ') : tm.label; };
  const hhmm = ts => new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  const mmss = ms => { const s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  const dur = sec => sec >= 3600 ? Math.floor(sec / 3600) + ' h ' + Math.round((sec % 3600) / 60) + ' min' : Math.round(sec / 60) + ' min';

  function createOrganizerApp(rootEl, opts) {
    opts = opts || {};
    const st = {
      t: null,
      net: { status: 'connecting', mode: '', queued: 0 },
      rulesDraft: null, rulesDirty: false,
      spDraft: null, spDirty: false, adRate: null,
      form: { round: '', format: 'singles', a1: '', a2: '', b1: '', b2: '' },
      spForm: { name: '', tagline: '', colour: '#1F5F8B', audio: '', durationSec: 12, imageUrl: '' },
      seenAlerts: {},
      firstTournament: true
    };
    rootEl.classList.add('desk-root');

    // the organizer tab can host the hub itself when there is no server
    const host = H.createHost({ state: SY.load('cs:tournament', null) || undefined, courts: opts.courts || 2, persist: s => SY.save('cs:tournament', s) });

    const transport = SY.createTransport({
      role: 'organizer', localHub: opts.localHub, mode: opts.mode, wsUrl: opts.wsUrl,
      hubHandler: (msg, from) => host.handle(msg, from),
      onStatus: (s, info) => { st.net = { status: s, mode: info.mode, queued: info.queued }; renderTop(); },
      onMessage: msg => {
        if (msg.type !== 'snapshot' && msg.type !== 'tournament') return;
        st.t = msg.tournament;
        if (!st.rulesDirty) st.rulesDraft = Object.assign({}, st.t.rules);
        if (!st.spDirty) { st.spDraft = S.clone(st.t.sponsors); st.adRate = st.t.adRateCad; }
        if (!st.firstTournament) {
          st.t.alerts.forEach(a => { if (!a.ack && !st.seenAlerts[a.id]) { st.seenAlerts[a.id] = true; if (a.kind === 'umpire' || a.kind === 'dispute') A.cues.alert(); else if (a.kind === 'freed' || a.kind === 'result') A.cues.confirm(); } });
        } else st.t.alerts.forEach(a => { st.seenAlerts[a.id] = true; });
        st.firstTournament = false;
        render();
      }
    });
    function send(msg) { transport.send(msg); }

    /* ------------------------------------------------------------ */
    /* render                                                       */
    /* ------------------------------------------------------------ */
    function render() {
      if (!st.t) {
        rootEl.innerHTML = top() + '<div class="dk-main"><div class="dk-panel courts" style="grid-column:1/-1"><div class="body"><p>Connecting to the hub…</p><p class="empty">Run <code>npm start</code> for the WebSocket hub, or open this page and the court tablets in the same browser to sync between tabs.</p></div></div></div>';
        return;
      }
      const focus = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.keep : null;
      rootEl.innerHTML = top() + alerts() + '<div class="dk-main">' +
        '<div class="col-left">' + queuePanel() + '</div>' +
        '<div class="courts-col"><div class="courts">' + Object.values(st.t.courts).map(courtCard).join('') + '</div>' + resultsPanel() + '</div>' +
        '<div class="col-right">' + rulesPanel() + sponsorsPanel() + '</div>' +
        '</div>';
      if (focus) { const el = rootEl.querySelector('[data-keep="' + focus + '"]'); if (el) el.focus(); }
    }
    function renderTop() { const el = rootEl.querySelector('.dk-top'); if (el) el.outerHTML = top(); }

    function top() {
      const hub = st.net.status !== 'online' ? ['hub-off', st.net.status === 'connecting' ? 'Connecting to hub' : 'Hub offline'] :
        st.net.mode === 'ws' ? ['hub-ws', 'Hub: server'] : st.net.mode === 'local' ? ['hub-local', 'Hub: in-page demo'] : ['hub-bc', 'Hub: this tab'];
      const t = st.t;
      return '<div class="dk-top"><h1>' + (t ? '<input data-field="name" data-keep="name" value="' + esc(t.name) + '" aria-label="Tournament name"><small>' + esc(t.venue || '') + '</small>' : 'RallyPoint') + '</h1>' +
        '<span class="pill" style="border-color:#3A4045;color:#AEB7BC">Organizer desk</span><span class="spacer"></span>' +
        '<span class="pill ' + hub[0] + '">' + hub[1] + '</span><span class="clock">' + hhmm(Date.now()) + '</span></div>';
    }

    function alerts() {
      const list = st.t.alerts.filter(a => !a.ack).slice(-6).reverse();
      if (!list.length) return '';
      return '<div class="dk-alerts">' + list.map(a => {
        const court = st.t.courts[a.courtId];
        const acts = a.kind === 'umpire' || a.kind === 'dispute'
          ? '<button class="btn sm primary" data-action="ack" data-id="' + a.id + '">On my way</button>'
          : a.kind === 'freed' && court && court.status === 'free' && st.t.queue.length
            ? '<button class="btn sm go" data-action="assign-next" data-court="' + esc(a.courtId) + '">Assign #' + st.t.matches[st.t.queue[0]].number + '</button><button class="btn sm ghost" data-action="ack" data-id="' + a.id + '">Dismiss</button>'
            : '<button class="btn sm ghost" data-action="ack" data-id="' + a.id + '">Dismiss</button>';
        return '<div class="dk-alert ' + esc(a.kind) + '"><span class="when">' + hhmm(a.ts) + '</span><span class="txt">' + esc(a.message) + '</span><span class="acts">' + acts + '</span></div>';
      }).join('') + (list.length > 1 ? '<div style="text-align:right"><button class="btn sm ghost" data-action="ack-all">Clear all</button></div>' : '') + '</div>';
    }

    function statusOf(c) {
      if (!c.online && c.status !== 'free') return ['offline', 'Offline'];
      if (!c.online) return ['offline', 'Tablet offline'];
      const snap = c.snapshot || {};
      if (c.status === 'live' && snap.rest && snap.rest.endsAt > Date.now()) return ['rest', snap.rest.kind === 'setBreak' ? 'Set break' : 'Changeover'];
      return { live: ['live', 'Live'], free: ['free', 'Free'], assigned: ['assigned', 'Assigned'], ready: ['ready', 'Ready to start'], done: ['done', 'Finished'] }[c.status] || ['free', c.status];
    }

    function courtCard(c) {
      const t = st.t, snap = c.snapshot, sb = snap && snap.sb;
      const [cls, label] = statusOf(c);
      const match = c.matchId ? t.matches[c.matchId] : null;
      const umpire = t.alerts.some(a => !a.ack && a.courtId === c.id && (a.kind === 'umpire' || a.kind === 'dispute'));
      let plan;
      if (sb && (c.status === 'live' || c.status === 'done')) {
        plan = '<div class="score">' + sb.teams.map(tm => '<div class="row ' + (tm.serving ? 'serving' : '') + (tm.winner ? ' winner' : '') + '"><div class="nm"><span class="dot"></span><span>' + esc(shortLabel(tm)) + '</span></div><div class="n">' + tm.sets + '</div><div class="n">' + tm.games + '</div><div class="n pts">' + esc(tm.points) + '</div></div>').join('') + '</div>';
      } else {
        const msg = c.status === 'free' ? 'Free<small>' + (t.queue.length ? 'Next in queue: #' + t.matches[t.queue[0]].number : 'Queue is empty') + '</small>'
          : c.status === 'assigned' || c.status === 'ready' ? 'Match #' + (match ? match.number : '') + '<small>' + (match ? names(match.teams[0]) + ' v ' + names(match.teams[1]) : '') + '<br>Waiting for the tablet to start play</small>'
            : c.online ? 'Waiting for the tablet' : 'Tablet offline<small>Scores are kept on the tablet and sync when it reconnects</small>';
        plan = '<div class="free-msg"><div>' + msg + '</div></div>';
      }
      const rest = sb && snap.rest && snap.rest.endsAt > Date.now() ? '<div><span>Rest ends in</span><b data-rest-until="' + snap.rest.endsAt + '">' + mmss(snap.rest.endsAt - Date.now()) + '</b></div>' : '';
      const meta = match ? '<div class="cc-meta">' +
        '<div><span>Match</span><b>#' + match.number + ' · ' + esc(match.format) + '</b></div>' +
        '<div><span>Round</span><b>' + esc(match.round || '—') + '</b></div>' +
        (sb ? '<div><span>Sets</span><b>' + esc(sb.setLine || '—') + '</b></div><div><span>Call</span><b>' + esc(sb.call || '—') + (sb.tiebreak ? ' · ' + (sb.tiebreak === 'match' ? 'match TB' : 'TB') : '') + '</b></div>' : '') +
        (sb && sb.server ? '<div><span>Serving</span><b>' + esc(sb.server.name) + '</b></div>' : '') +
        rest +
        '<div><span>Rules</span><b class="' + (c.rulesVersion < t.rulesVersion && c.status !== 'free' ? 'warn' : '') + '">v' + (c.rulesVersion || 0) + (c.rulesVersion < t.rulesVersion && c.status !== 'free' ? ' (desk is v' + t.rulesVersion + ')' : '') + '</b></div>' +
        '<div><span>Voice</span><b>' + esc(snap && snap.voice === 'listening' ? 'Active' : snap && snap.voice === 'blocked' ? 'Mic blocked' : 'Off') + '</b></div>' +
        '<div><span>Updated</span><b>' + (c.lastSeen ? hhmm(c.lastSeen) : '—') + '</b></div>' +
        (snap && snap.result ? '<div><span>Result</span><b>' + esc(snap.result.winnerName) + ' ' + esc(snap.result.line) + '</b></div>' : '') +
        '</div>' : '<div class="cc-meta"><div><span>Updated</span><b>' + (c.lastSeen ? hhmm(c.lastSeen) : '—') + '</b></div><div><span>Tablet</span><b>' + (c.online ? 'Connected' : 'Offline') + '</b></div></div>';
      const canAssign = (c.status === 'free' || c.status === 'done') && t.queue.length;
      const acts = '<div class="cc-acts">' +
        (canAssign ? '<button class="btn go" data-action="assign-next" data-court="' + esc(c.id) + '">Assign next (#' + t.matches[t.queue[0]].number + ')</button>' : '') +
        (umpire ? '<button class="btn primary" data-action="ack-court" data-court="' + esc(c.id) + '">On my way</button>' : '') +
        (c.matchId ? '<button class="btn ghost" data-action="clear-court" data-court="' + esc(c.id) + '">' + (c.status === 'done' ? 'Clear court' : 'Send back to queue') + '</button>' : '') +
        '<span class="spacer"></span>' +
        (st.net.mode !== 'local' ? '<a class="btn ghost" href="court.html?court=' + esc(c.id) + '" target="_blank" rel="noopener">Open tablet view</a>' : '') +
        '</div>';
      return '<div class="court-card" data-court-id="' + esc(c.id) + '"><div class="cc-head"><h3>' + esc(c.name) + '</h3>' + (umpire ? '<span class="umpire">Director requested</span>' : '') + '<span class="st ' + cls + '">' + label + '</span></div>' +
        '<div class="plan ' + (c.online ? '' : 'dim') + '"><div class="lines"><div class="sl t"></div><div class="sl b"></div><div class="sv l"></div><div class="sv r"></div><div class="cs"></div></div>' + plan + '</div>' + meta + acts + '</div>';
    }

    function queuePanel() {
      const t = st.t;
      const free = H.freeCourts(t);
      const items = H.queuedMatches(t).map((m, i) => '<div class="queue-item"><div><span class="no">#' + m.number + '</span> <span class="rd">' + esc(m.round || (m.format === 'doubles' ? 'Doubles' : 'Singles')) + '</span></div>' +
        '<div class="asg">' + Object.values(t.courts).map(c => '<button class="btn sm ' + (c.status === 'free' ? 'go' : 'ghost') + '" data-action="assign" data-court="' + esc(c.id) + '" data-match="' + esc(m.id) + '" title="' + (c.status === 'free' ? 'Court is free' : 'Court is busy — this will replace its assignment') + '">' + esc(c.name.replace('Court ', 'C')) + '</button>').join('') +
        '<button class="btn sm ghost" data-action="remove-match" data-match="' + esc(m.id) + '" aria-label="Remove">×</button></div>' +
        '<div class="who">' + esc(names(m.teams[0])) + '<span class="v">v</span>' + esc(names(m.teams[1])) + '</div></div>').join('');
      const f = st.form;
      const dbl = f.format === 'doubles';
      const form = '<form class="add-match" data-action="add-match">' +
        '<div class="two"><label class="field">Round<input data-form="round" data-keep="round" value="' + esc(f.round) + '" placeholder="Open Singles · R2"></label>' +
        '<label class="field">Format<select data-form="format"><option value="singles"' + (dbl ? '' : ' selected') + '>Singles</option><option value="doubles"' + (dbl ? ' selected' : '') + '>Doubles</option></select></label></div>' +
        '<div class="two"><label class="field">Side A<input data-form="a1" data-keep="a1" value="' + esc(f.a1) + '" placeholder="Player" required></label>' + (dbl ? '<label class="field">Partner<input data-form="a2" data-keep="a2" value="' + esc(f.a2) + '" placeholder="Partner" required></label>' : '<span></span>') + '</div>' +
        '<div class="two"><label class="field">Side B<input data-form="b1" data-keep="b1" value="' + esc(f.b1) + '" placeholder="Player" required></label>' + (dbl ? '<label class="field">Partner<input data-form="b2" data-keep="b2" value="' + esc(f.b2) + '" placeholder="Partner" required></label>' : '<span></span>') + '</div>' +
        '<div><button class="btn primary" type="submit">Add to queue</button></div></form>';
      return '<div class="dk-panel"><h2>Match queue <small>' + t.queue.length + ' waiting · ' + free.length + ' court' + (free.length === 1 ? '' : 's') + ' free</small></h2><div class="body">' + (items || '<p class="empty">The queue is empty. Add a match below.</p>') + form + '</div></div>';
    }

    function rulesPanel() {
      const r = st.rulesDraft || st.t.rules;
      const t = st.t;
      const preset = Object.keys(S.PRESETS).map(k => '<button class="btn sm ' + (r.preset === k ? 'on' : 'ghost') + '" data-action="preset" data-preset="' + k + '">' + ({ standard: 'Standard', noad: 'No-Ad', fast4: 'Fast4 / Express', oneset: 'One set' }[k]) + '</button>').join('');
      const sel = (k, opts, lbl) => '<label class="field row">' + lbl + '<select data-rule="' + k + '">' + opts.map(o => '<option value="' + o[0] + '"' + (String(r[k]) === String(o[0]) ? ' selected' : '') + '>' + o[1] + '</option>').join('') + '</select></label>';
      const chk = (k, lbl) => '<label class="field row">' + lbl + '<input type="checkbox" data-rule="' + k + '"' + (r[k] ? ' checked' : '') + '></label>';
      const num = (k, lbl, step) => '<label class="field row">' + lbl + '<input type="number" min="0" step="' + (step || 5) + '" data-rule="' + k + '" data-keep="' + k + '" value="' + esc(r[k]) + '"></label>';
      const courts = Object.values(t.courts).filter(c => c.status !== 'free').map(c => c.name.replace('Court ', 'C') + ' v' + (c.rulesVersion || 0)).join(' · ');
      return '<div class="dk-panel"><h2>Rules for all courts <small>v' + t.rulesVersion + '</small></h2><div class="body rules-grid">' +
        '<div class="preset">' + preset + '</div>' +
        sel('bestOf', [[1, 'One set'], [3, 'Best of 3'], [5, 'Best of 5']], 'Match length') +
        sel('gamesPerSet', [[4, '4 games'], [6, '6 games']], 'Games per set') +
        chk('noAd', 'No-Ad scoring (deciding point at deuce)') +
        sel('tiebreakTo', [[5, 'To 5'], [7, 'To 7']], 'Set tiebreak') +
        chk('finalSetMatchTiebreak', 'Match tiebreak instead of a deciding set') +
        sel('matchTiebreakTo', [[7, 'To 7'], [10, 'To 10']], 'Match tiebreak') +
        chk('express', 'Express / Fast-Play: change ends, no rest') +
        num('serveClockSec', 'Serve clock (s)', 5) +
        num('changeoverSec', 'Changeover rest (s)', 10) +
        num('setBreakSec', 'Set break (s)', 10) +
        num('timeCallSec', '“Time” call at (s)', 5) +
        '<div class="push ' + (st.rulesDirty ? 'dirty' : '') + '"><span>' + (st.rulesDirty ? 'Unpushed changes' : (courts ? 'Courts on: ' + esc(courts) : 'No live courts')) + '</span><button class="btn ' + (st.rulesDirty ? 'yellow' : 'ghost') + '" data-action="push-rules">Push to courts</button></div>' +
        '</div></div>';
    }

    function sponsorsPanel() {
      const t = st.t, list = st.spDraft || t.sponsors;
      const rev = H.revenue(t);
      const items = list.map((sp, i) => '<div class="sp-item ' + (sp.enabled === false ? 'off' : '') + '"><div class="sw" style="background:' + esc(sp.colour) + '"></div><div><div class="nm">' + esc(sp.name) + '<small>' + (sp.durationSec || 12) + ' s</small></div><div class="tg">' + esc(sp.tagline) + '</div></div><div class="im"><b>' + (t.impressions[sp.id] || 0) + '</b>plays</div>' +
        '<div class="acts"><button class="btn sm ghost" data-action="sp-toggle" data-i="' + i + '">' + (sp.enabled === false ? 'Enable' : 'Pause') + '</button><button class="btn sm ghost" data-action="sp-remove" data-i="' + i + '">Remove</button></div></div>').join('');
      const f = st.spForm;
      const form = '<form class="add-match" data-action="add-sponsor">' +
        '<div class="two"><label class="field">Sponsor<input data-sp="name" data-keep="spname" value="' + esc(f.name) + '" required placeholder="Café Racquet"></label><label class="field">Colour<input type="color" data-sp="colour" value="' + esc(f.colour) + '"></label></div>' +
        '<label class="field">Tagline (shown on court)<input data-sp="tagline" data-keep="sptag" value="' + esc(f.tagline) + '" placeholder="Free espresso with your draw sheet"></label>' +
        '<label class="field">Audio line (read aloud during changeovers)<input data-sp="audio" data-keep="spaudio" value="' + esc(f.audio) + '" placeholder="Optional"></label>' +
        '<div class="two"><label class="field">Seconds per play<input type="number" min="5" max="60" data-sp="durationSec" value="' + esc(f.durationSec) + '"></label><label class="field">Image URL<input data-sp="imageUrl" data-keep="spimg" value="' + esc(f.imageUrl) + '" placeholder="Optional logo"></label></div>' +
        '<div><button class="btn primary" type="submit">Add sponsor</button></div></form>';
      return '<div class="dk-panel"><h2>Court-side sponsors <small>changeover loop</small></h2><div class="body">' +
        '<div class="sp-list">' + (items || '<p class="empty">No sponsors yet. Changeovers show the score only.</p>') + '</div>' +
        '<div class="push ' + (st.spDirty ? 'dirty' : '') + '"><label class="field row" style="gap:6px">Value per play $<input type="number" step="0.05" min="0" data-sp-rate data-keep="rate" value="' + esc(st.adRate == null ? t.adRateCad : st.adRate) + '" style="width:80px"></label><button class="btn ' + (st.spDirty ? 'yellow' : 'ghost') + '" data-action="push-sponsors">Push loop to courts</button></div>' +
        '<div class="rev"><div><span>Plays today</span><b>' + rev.impressions + '</b></div><div><span>Estimated value</span><b>$' + rev.estimateCad.toFixed(2) + '</b></div></div>' +
        form + '</div></div>';
    }

    function resultsPanel() {
      const t = st.t;
      const rows = t.results.map(r => '<tr><td>#' + r.number + '<br><small style="color:var(--muted)">' + esc(r.round || r.format) + '</small></td><td><span class="w">' + esc(r.result ? r.result.winnerName : '') + '</span><br>' + esc(r.result ? r.result.loserName : '') + '</td><td class="sc">' + esc(r.result ? r.result.line : '') + '</td><td>' + esc(t.courts[r.courtId] ? t.courts[r.courtId].name : r.courtId) + '<br><small style="color:var(--muted)">' + hhmm(r.ts) + ' · ' + (r.result ? dur(r.result.durationSec) : '') + '</small></td></tr>').join('');
      return '<div class="dk-panel" style="margin-top:18px"><h2>Results <small>' + t.results.length + ' recorded</small>' + (t.results.length ? '<button class="btn sm ghost" data-action="export">Export CSV</button>' : '') + '</h2><div class="body">' +
        (rows ? '<table class="res-table"><thead><tr><th>Match</th><th>Winner / loser</th><th>Score</th><th>Court · time</th></tr></thead><tbody>' + rows + '</tbody></table>' : '<p class="empty">Results arrive here the moment a tablet records the final point.</p>') + '</div></div>';
    }

    /* ------------------------------------------------------------ */
    /* events                                                       */
    /* ------------------------------------------------------------ */
    rootEl.addEventListener('click', e => {
      const b = e.target.closest('[data-action]');
      if (!b || b.tagName === 'FORM' || b.tagName === 'A') return;
      A.unlock();
      const t = st.t; if (!t) return;
      switch (b.dataset.action) {
        case 'assign': send({ type: 'org:assign', courtId: b.dataset.court, matchId: b.dataset.match }); break;
        case 'assign-next': if (t.queue.length) send({ type: 'org:assign', courtId: b.dataset.court, matchId: t.queue[0] }); break;
        case 'clear-court': send({ type: 'org:clearCourt', courtId: b.dataset.court }); break;
        case 'remove-match': send({ type: 'org:removeMatch', matchId: b.dataset.match }); break;
        case 'ack': send({ type: 'org:ack', alertId: b.dataset.id }); break;
        case 'ack-all': send({ type: 'org:ackAll' }); break;
        case 'ack-court': t.alerts.filter(a => !a.ack && a.courtId === b.dataset.court).forEach(a => send({ type: 'org:ack', alertId: a.id })); break;
        case 'preset': st.rulesDraft = S.normalizeRules(Object.assign({}, st.rulesDraft || t.rules, S.PRESETS[b.dataset.preset])); st.rulesDirty = true; render(); break;
        case 'push-rules': send({ type: 'org:rules', rules: st.rulesDraft }); st.rulesDirty = false; break;
        case 'sp-toggle': st.spDraft[+b.dataset.i].enabled = st.spDraft[+b.dataset.i].enabled === false; st.spDirty = true; render(); break;
        case 'sp-remove': st.spDraft.splice(+b.dataset.i, 1); st.spDirty = true; render(); break;
        case 'push-sponsors': send({ type: 'org:sponsors', sponsors: st.spDraft, adRateCad: st.adRate }); st.spDirty = false; break;
        case 'export': exportCsv(); break;
      }
    });
    rootEl.addEventListener('submit', e => {
      const f = e.target.closest('form[data-action]');
      if (!f) return;
      e.preventDefault();
      if (f.dataset.action === 'add-match') {
        const d = st.form;
        const dbl = d.format === 'doubles';
        const team = (a, b) => ({ name: '', players: [{ name: a.trim() }].concat(dbl ? [{ name: b.trim() }] : []) });
        send({ type: 'org:addMatch', match: { round: d.round.trim(), format: d.format, teams: [team(d.a1, d.a2), team(d.b1, d.b2)] } });
        st.form = { round: d.round, format: d.format, a1: '', a2: '', b1: '', b2: '' };
      } else if (f.dataset.action === 'add-sponsor') {
        const s = st.spForm;
        const dark = /^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(s.colour);
        const lum = dark ? (0.299 * parseInt(dark[1], 16) + 0.587 * parseInt(dark[2], 16) + 0.114 * parseInt(dark[3], 16)) : 0;
        st.spDraft.push({ id: H.uid('sp'), name: s.name.trim(), tagline: s.tagline.trim(), colour: s.colour, text: lum > 150 ? '#0B1F2A' : '#FFFFFF', audio: s.audio.trim(), durationSec: Math.max(5, +s.durationSec || 12), imageUrl: s.imageUrl.trim(), enabled: true });
        st.spDirty = true;
        st.spForm = { name: '', tagline: '', colour: s.colour, audio: '', durationSec: s.durationSec, imageUrl: '' };
        render();
      }
    });
    rootEl.addEventListener('input', e => {
      const el = e.target;
      if (el.dataset.form) { st.form[el.dataset.form] = el.value; if (el.dataset.form === 'format') render(); }
      else if (el.dataset.sp) st.spForm[el.dataset.sp] = el.value;
      else if (el.hasAttribute('data-sp-rate')) { st.adRate = parseFloat(el.value) || 0; st.spDirty = true; }
      else if (el.dataset.rule) {
        const r = st.rulesDraft || Object.assign({}, st.t.rules);
        const v = el.type === 'checkbox' ? el.checked : (el.type === 'number' ? Math.max(0, parseInt(el.value, 10) || 0) : (isNaN(+el.value) ? el.value : +el.value));
        r[el.dataset.rule] = v;
        if (el.dataset.rule === 'gamesPerSet') r.tiebreakAt = v;
        if (el.dataset.rule === 'express') { r.changeoverSec = v ? 0 : 90; r.setBreakSec = v ? 0 : 120; }
        r.preset = 'custom';
        st.rulesDraft = r; st.rulesDirty = true;
        const push = rootEl.querySelector('.push');
        if (push) { push.classList.add('dirty'); push.querySelector('span').textContent = 'Unpushed changes'; push.querySelector('button').className = 'btn yellow'; }
      }
    });
    rootEl.addEventListener('change', e => {
      const el = e.target;
      if (el.dataset.field === 'name') send({ type: 'org:setTournament', name: el.value });
      if (el.dataset.form === 'format') { st.form.format = el.value; render(); }
      if (el.dataset.sp === 'colour') st.spForm.colour = el.value;
    });

    function exportCsv() {
      const t = st.t;
      const rows = [['match', 'round', 'format', 'court', 'winner', 'loser', 'score', 'duration_min', 'finished_at']].concat(t.results.map(r => [r.number, r.round, r.format, t.courts[r.courtId] ? t.courts[r.courtId].name : r.courtId, r.result && r.result.winnerName, r.result && r.result.loserName, r.result && r.result.line, r.result ? Math.round(r.result.durationSec / 60) : '', new Date(r.ts).toISOString()]));
      const csv = rows.map(r => r.map(v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"').join(',')).join('\n');
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
      a.download = (t.name || 'results').replace(/[^\w]+/g, '-').toLowerCase() + '-results.csv';
      document.body.appendChild(a); a.click(); a.remove();
    }

    // clocks: rest countdowns and the wall clock, without re-rendering forms
    setInterval(() => {
      rootEl.querySelectorAll('[data-rest-until]').forEach(el => { const ms = +el.dataset.restUntil - Date.now(); el.textContent = mmss(ms); if (ms <= 0) render(); });
      const c = rootEl.querySelector('.dk-top .clock'); if (c) c.textContent = hhmm(Date.now());
    }, 1000);

    render();
    return { transport, state: st, render, host, send };
  }

  root.RallyPoint.createOrganizerApp = createOrganizerApp;
})(typeof self !== 'undefined' ? self : this);

</script>
<script>
(function () {
  const PREFIX = 'csdemo';
  const host = RallyPoint.hub.createHost({ courts: 2, state: RallyPoint.sync.load(PREFIX + ':tournament', null) || undefined, persist: s => RallyPoint.sync.save(PREFIX + ':tournament', s) });
  const localHub = RallyPoint.sync.createLocalHub(host, { latencyMs: 200 });
  const desk = RallyPoint.createOrganizerApp(document.getElementById('desk'), { localHub, courts: 2 });
  const courts = {
    '1': RallyPoint.createCourtApp(document.getElementById('court1'), { courtId: '1', localHub, storagePrefix: PREFIX }),
    '2': RallyPoint.createCourtApp(document.getElementById('court2'), { courtId: '2', localHub, storagePrefix: PREFIX })
  };
  window.demo = { host, localHub, desk, courts };

  document.querySelectorAll('[data-net]').forEach(cb => cb.addEventListener('change', () => {
    courts[cb.dataset.net].setOnline(cb.checked);
    cb.parentElement.classList.toggle('cut', !cb.checked);
    cb.parentElement.lastChild.textContent = cb.checked ? ' Internet' : ' Internet cut — scoring locally';
  }));
  document.querySelectorAll('[data-auto]').forEach(b => b.addEventListener('click', () => {
    const on = !b.classList.contains('on');
    b.classList.toggle('on', on);
    b.textContent = on ? 'Stop auto-play' : 'Auto-play points';
    courts[b.dataset.auto].autoplay(on, 1100);
  }));
  document.querySelector('[data-demo="assign-both"]').addEventListener('click', () => {
    const t = host.state;
    const free = Object.values(t.courts).filter(c => c.status === 'free' || c.status === 'done');
    free.forEach((c, i) => { if (t.queue[i]) desk.send({ type: 'org:assign', courtId: c.id, matchId: t.queue[i] }); });
  });
  document.querySelector('[data-demo="reset"]').addEventListener('click', () => {
    Object.keys(localStorage).filter(k => k.startsWith(PREFIX + ':')).forEach(k => localStorage.removeItem(k));
    location.reload();
  });
})();
</script>
</body>
</html>
